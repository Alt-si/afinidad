<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fichaje Abierto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: banda de cancha arriba con la marca y las pestañas; debajo, vitrina en grilla de fichas (Explorar) o formulario + vista previa en vivo (Mi ficha). */
:root{
  --bg:#edf1ec; --surface:#ffffff; --surface-2:#f5f8f4; --ink:#13211a; --muted:#56685e; --line:#d2dcd4;
  --pitch:#0f3a2b; --pitch-2:#145039; --chalk:#eef4ee; --accent:#e9b21c; --accent-ink:#1d1704;
  --ok:#1f7a4a; --warn:#a86a00; --bad:#b3362b;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-data:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1511; --surface:#12201a; --surface-2:#172820; --ink:#e4ede6; --muted:#93a79b; --line:#253a30;
  --pitch:#0a2a1f; --pitch-2:#0f3a2b; --chalk:#e4efe6; --accent:#f0c23c; --accent-ink:#1d1704;
  --ok:#4cc184; --warn:#e3a93b; --bad:#ec7a6e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1511; --surface:#12201a; --surface-2:#172820; --ink:#e4ede6; --muted:#93a79b; --line:#253a30;
  --pitch:#0a2a1f; --pitch-2:#0f3a2b; --chalk:#e4efe6; --accent:#f0c23c; --accent-ink:#1d1704;
  --ok:#4cc184; --warn:#e3a93b; --bad:#ec7a6e; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Banda de cancha */
.pitch{background:var(--pitch);color:var(--chalk);position:relative;overflow:hidden}
.pitch::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;
  background:
   radial-gradient(circle at 100% 50%, transparent 118px, var(--chalk) 119px, var(--chalk) 121px, transparent 122px),
   linear-gradient(90deg, transparent calc(100% - 2px), var(--chalk) calc(100% - 2px));
}
.pitch .wrap{position:relative;padding-block:22px 0}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,6vw,54px);letter-spacing:.01em;line-height:.95;text-transform:uppercase}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:color-mix(in srgb,var(--chalk) 75%,transparent);max-width:46ch}
.tabs{display:flex;gap:4px;margin-top:20px}
.tab{appearance:none;border:0;background:transparent;color:color-mix(in srgb,var(--chalk) 70%,transparent);padding:10px 16px 12px;border-radius:8px 8px 0 0;cursor:pointer;font-family:var(--f-data);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.tab:hover{color:var(--chalk)}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}

main .wrap{padding-block:24px 56px}

/* Filtros */
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end;margin-bottom:18px}
@media (max-width:820px){.filters{grid-template-columns:1fr 1fr}.filters .f-q{grid-column:1/-1}}
.filters .f-q{grid-column:span 2}
label.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.lbl{font-family:var(--f-data);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=url],select,textarea{
  width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;}
textarea{resize:vertical;min-height:90px}
.chk{display:flex;gap:8px;align-items:center;padding:9px 0;white-space:nowrap;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--pitch-2)}

.resbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.resbar .count{font-family:var(--f-data);font-weight:600;font-size:16px;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums}

/* Fichas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.pcard{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s ease,border-color .15s ease}
.pcard:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--pitch-2) 50%,var(--line))}
.photo{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--pitch);overflow:hidden}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:64px;color:color-mix(in srgb,var(--chalk) 25%,transparent)}
.dorsal{position:absolute;left:10px;top:8px;font-family:var(--f-display);font-weight:900;font-size:44px;line-height:1;color:var(--accent);text-shadow:0 2px 10px rgba(0,0,0,.45)}
.pos{position:absolute;right:10px;top:12px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-data);font-weight:700;letter-spacing:.06em;font-size:14px;padding:2px 8px;border-radius:4px}
.pbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pname{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
.pmeta{color:var(--muted);font-size:14px}
.specs{display:flex;gap:14px;font-family:var(--f-data);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.specs b{font-weight:700}
.specs span{color:var(--muted);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:block}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st-libre{color:var(--ok)} .st-abierto{color:var(--warn)} .st-prueba{color:var(--muted)}

.empty{border:2px dashed var(--line);border-radius:var(--r);padding:36px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h2{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase}
.empty p{margin:0;color:var(--muted);max-width:52ch}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}

/* Mi ficha */
.edit{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
@media (max-width:900px){.edit{grid-template-columns:1fr;gap:16px}.edit>.preview-col{order:-1;position:static;display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;align-items:start}.preview-col>.lbl{grid-column:1/-1}.preview-col #full-prev{align-self:end;justify-self:start}.preview-col .pname{font-size:18px}.preview-col .pbody{padding:8px 10px 10px}.preview-col .pmeta,.preview-col .status{font-size:12px}.preview-col .specs{display:none}.preview-col .dorsal{font-size:30px}.preview-col .pos{font-size:12px;top:8px;right:6px}}
.preview-col{position:sticky;top:16px;display:flex;flex-direction:column;gap:10px}
.preview-col .lbl{margin-bottom:2px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 20px;margin-bottom:16px}
.sec h2{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin-bottom:4px}
.sec .hint{color:var(--muted);font-size:14px;margin:0 0 14px}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:12px}
.row:last-child{margin-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px;user-select:none;background:var(--surface-2)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){background:var(--pitch-2);border-color:var(--pitch-2);color:var(--chalk)}
.chip:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.traj{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.trow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) 80px 80px minmax(0,2fr) auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
@media (max-width:760px){.trow{grid-template-columns:1fr 1fr}.trow .t-club,.trow .t-logros{grid-column:1/-1}}
.media-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.thumb{width:110px;aspect-ratio:4/5;border-radius:8px;background:var(--pitch);overflow:hidden;display:grid;place-items:center;color:color-mix(in srgb,var(--chalk) 40%,transparent);font-size:13px;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.vlist{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.vitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.vitem .vtag{font-family:var(--f-data);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--line);padding:2px 6px;border-radius:4px}
.vitem input{background:var(--surface)}
.addv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.savebar{position:sticky;bottom:0;z-index:5;background:var(--bg);box-shadow:0 -6px 12px -8px rgba(0,0,0,.25);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.savebar .msg{font-size:14px;color:var(--muted);flex:1;min-width:160px}
.savebar .msg.ok{color:var(--ok)} .savebar .msg.bad{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.banner b{display:block;margin-bottom:4px}

/* Detalle */
dialog{border:0;padding:0;max-width:min(920px,calc(100vw - 24px));width:100%;max-height:calc(100dvh - 24px);border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(6,18,13,.62)}
.dhead{display:grid;grid-template-columns:260px minmax(0,1fr);background:var(--pitch);color:var(--chalk);position:relative}
@media (max-width:640px){.dhead{grid-template-columns:1fr}.dhead .photo{max-height:360px;aspect-ratio:auto;height:360px}}
.dhead .photo{border-radius:0}
.dinfo{padding:22px 22px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.dinfo .pname{font-size:clamp(30px,5vw,44px)}
.dinfo .apodo{font-family:var(--f-data);font-size:18px;color:var(--accent);letter-spacing:.04em}
.dinfo .pmeta{color:color-mix(in srgb,var(--chalk) 75%,transparent)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px 18px;margin-top:6px}
.kv div span{display:block;font-family:var(--f-data);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--chalk) 60%,transparent)}
.kv div b{font-family:var(--f-data);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.closex{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:20px;cursor:pointer;line-height:1}
.dbody{padding:20px 22px 26px;display:grid;gap:24px}
.dbody h3{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.02em;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats div{padding:12px 14px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-family:var(--f-data);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.stats div:nth-child(2){border-right:0}.stats div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.timeline li:last-child{border-bottom:0}
.timeline .yrs{font-family:var(--f-data);font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.timeline .club{font-weight:700}
.timeline .cat{font-size:13px;color:var(--muted)}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.vid{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
.vid video{width:100%;display:block;background:#000;aspect-ratio:16/9;max-width:100%}
.vid .vt{padding:8px 12px;font-weight:600;font-size:14px}
.vlink{display:flex;gap:12px;align-items:center;padding:14px;text-decoration:none;color:inherit}
.vlink .play{width:44px;height:44px;border-radius:50%;background:var(--pitch-2);display:grid;place-items:center;flex:none}
.vlink .play::after{content:"";border-left:14px solid var(--chalk);border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.vlink small{display:block;color:var(--muted);word-break:break-all}
.traits{display:flex;flex-wrap:wrap;gap:8px}
.traits span{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px}
.bio{max-width:65ch;margin:0;white-space:pre-line}
.contact{display:flex;flex-direction:column;gap:8px}
.cline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.cline .lbl{width:84px}
.cline code{font-family:var(--f-data);font-size:17px;font-weight:600;user-select:all;flex:1;min-width:0;word-break:break-all}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.loading{color:var(--muted);padding:20px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.demobar{background:var(--accent);color:var(--accent-ink);font-size:14px}
.demobar .wrap{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:8px}
.demobar .demo-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demobar .btn{background:var(--surface);color:var(--ink)}
</style>
</head>
<body>


<header class="pitch">
  <div class="wrap">
    <div class="brand">
      <h1>Fichaje <span>Abierto</span></h1>
      <p>La vitrina del fútbol amateur. Los jugadores cargan su ficha, los clubes buscan refuerzos.</p>
    </div>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button class="tab" role="tab" id="tab-explorar" data-view="explorar">Buscar jugadores</button>
      <button class="tab" role="tab" id="tab-mi-ficha" data-view="mi-ficha">Mi ficha</button>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <section id="view-explorar" aria-labelledby="tab-explorar">
      <div class="filters">
        <label class="fld f-q"><span class="lbl">Buscar</span><input type="text" id="f-q" placeholder="Nombre, ciudad, club…"></label>
        <label class="fld" id="f-dep-wrap" hidden><span class="lbl">Deporte</span><select id="f-dep"></select></label>
        <label class="fld"><span class="lbl">Posición</span><select id="f-pos"></select></label>
        <label class="fld"><span class="lbl">País</span><select id="f-pais"></select></label>
        <label class="fld" id="f-prov-wrap"><span class="lbl">Provincia</span><select id="f-prov"></select></label>
        <label class="fld"><span class="lbl">Pie hábil</span><select id="f-pie"><option value="">Todos</option><option value="derecho">Derecho</option><option value="izquierdo">Izquierdo</option><option value="ambidiestro">Ambidiestro</option></select></label>
        <label class="chk"><input type="checkbox" id="f-libres"> Solo libres</label>
        <label class="chk"><input type="checkbox" id="f-ue"> Pasaporte UE</label>
      </div>
      <div class="resbar"><div class="count" id="count">Cargando fichas…</div></div>
      <div id="grid"></div>
    </section>

    <section id="view-mi-ficha" aria-labelledby="tab-mi-ficha" hidden>
      <div id="mine"></div>
    </section>
  </div>
</main>

<dialog id="detail" aria-label="Ficha del jugador"></dialog>

<script>
(() => {
"use strict";
/* Deportes: fútbol es el principal. Para sumar otro, agregá una entrada en SPORTS con sus posiciones, cualidades, categorías y etiquetas de estadísticas. El selector de deporte aparece solo cuando hay más de uno. */
const SPORTS = {
  futbol: { nombre: "Fútbol",
    posiciones: [
  ["ARQ","Arquero"],["DFC","Defensor central"],["LD","Lateral derecho"],["LI","Lateral izquierdo"],
  ["MCD","Volante central (5)"],["MC","Mediocampista mixto"],["MO","Enganche (10)"],
  ["ED","Extremo derecho"],["EI","Extremo izquierdo"],["DC","Delantero centro (9)"]],
    categorias: ["Liga regional","Primera local","Reserva","Inferiores","Torneo Federal","Universitario","Futsal / Fútbol 5","Otro"],
    cualidades: ["Velocidad","Juego aéreo","Pegada","Gambeta","Visión de juego","Marca","Resistencia","Pelota parada","Liderazgo","Atajadas","Juego con los pies","Cabezazo","Pase largo","Definición"],
    stats: ["Partidos","Goles","Asistencias","Títulos"] }
};
const DEPORTE = "futbol";
const POS = SPORTS[DEPORTE].posiciones;
const POSMAP = Object.fromEntries(POS);
const PROV = ["Buenos Aires","CABA","Catamarca","Chaco","Chubut","Córdoba","Corrientes","Entre Ríos","Formosa","Jujuy","La Pampa","La Rioja","Mendoza","Misiones","Neuquén","Río Negro","Salta","San Juan","San Luis","Santa Cruz","Santa Fe","Santiago del Estero","Tierra del Fuego","Tucumán"];
const ISO = new Set("AF,AL,DE,AD,AO,AG,SA,DZ,AR,AM,AU,AT,AZ,BS,BD,BB,BH,BE,BZ,BJ,BY,BO,BA,BW,BR,BN,BG,BF,BI,BT,CV,KH,CM,CA,QA,TD,CL,CN,CY,CO,KM,CG,CD,KP,KR,CI,CR,HR,CU,DK,DM,EC,EG,SV,AE,ER,SK,SI,ES,US,EE,SZ,ET,PH,FI,FJ,FR,GA,GM,GE,GH,GD,GR,GT,GN,GQ,GW,GY,HT,HN,HK,HU,IN,ID,IQ,IR,IE,IS,MH,SB,IL,IT,JM,JP,JO,KZ,KE,KG,KI,XK,KW,LA,LS,LV,LB,LR,LY,LI,LT,LU,MO,MK,MG,MY,MW,MV,ML,MT,MA,MU,MR,MX,FM,MD,MC,MN,ME,MZ,MM,NA,NR,NP,NI,NE,NG,NO,NZ,OM,NL,PK,PW,PS,PA,PG,PY,PE,PL,PT,PR,GB,CF,CZ,DO,RW,RO,RU,WS,KN,SM,VC,LC,ST,SN,RS,SC,SL,SG,SY,SO,LK,ZA,SD,SS,SE,CH,SR,TH,TW,TZ,TJ,TL,TG,TO,TT,TN,TM,TR,TV,UA,UG,UY,UZ,VU,VA,VE,VN,YE,DJ,ZM,ZW".split(","));
const regionNames = (() => { try { return new Intl.DisplayNames(["es"], {type:"region"}); } catch { return null; } })();
const cName = c => { try { return (regionNames && regionNames.of(c)) || c; } catch { return c; } };
const COUNTRIES = [["AR", cName("AR")]].concat([...ISO].filter(c => c !== "AR").map(c => [c, cName(c)]).sort((a,b) => a[1].localeCompare(b[1], "es")));
const flag = c => ISO.has(c) ? String.fromCodePoint(...[...c].map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65)) : "";
const paisOf = p => ISO.has(p.pais) ? p.pais : (p.provincia === "Fuera de Argentina" ? "" : "AR");
const natName = v => ISO.has(v) ? cName(v) : String(v || "");
const placeOf = p => { const c = paisOf(p); const parts = [p.ciudad, p.provincia === "Fuera de Argentina" ? "" : p.provincia].filter(Boolean); if (c && c !== "AR") parts.push(cName(c)); return parts.length ? (c ? flag(c) + " " : "") + parts.join(", ") : ""; };
const natCode = v => { if (ISO.has(v)) return v; const t = String(v || "").trim().toLowerCase(); const hit = COUNTRIES.find(([,n]) => n.toLowerCase() === t); return hit ? hit[0] : ""; };
const countryOpts = (val, ph) => `<option value="">${ph}</option>` + COUNTRIES.map(([k,v]) => `<option value="${k}"${k===val?" selected":""}>${esc(v)}</option>`).join("");
function provFieldHTML(D){
  return D.pais === "AR"
    ? `<label class="fld"><span class="lbl">Provincia</span><select id="i-prov" data-k="provincia"><option value="">Elegí…</option>${PROV.map(p => `<option${p===D.provincia?" selected":""}>${esc(p)}</option>`).join("")}</select></label>`
    : `<label class="fld"><span class="lbl">Provincia / estado / región</span><input type="text" id="i-prov" data-k="provincia" maxlength="50" value="${esc(D.provincia)}"></label>`;
}
const CATS = SPORTS[DEPORTE].categorias;
const TRAITS = SPORTS[DEPORTE].cualidades;
const DISP = {libre:"Libre ahora", abierto:"Con club · escucha ofertas", prueba:"Disponible para pruebas"};
const MAX_VIDEOS = 6;

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => { try { const x = new URL(String(u)); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } };
const assetId = v => (typeof v === "string" && /^[A-Za-z0-9_-]{8,64}$/.test(v)) ? v : "";
const num = v => { const n = Number(v); return Number.isFinite(n) && n >= 0 ? n : null; };
const age = d => { if (!d) return null; const b = new Date(d); if (isNaN(b)) return null; const n = new Date(); let a = n.getFullYear()-b.getFullYear(); const m = n.getMonth()-b.getMonth(); if (m<0 || (m===0 && n.getDate()<b.getDate())) a--; return a>=0 && a<90 ? a : null; };
const initials = n => String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase() || "?";

const S = { db:null, user:null, assets:null, uid:null, canWrite:null, players:[], loaded:false, ready:false, mineLoaded:false, myDoc:null, draft:null, dirty:false };

/* ---------- filtros ---------- */
$("#f-pos").innerHTML = `<option value="">Todas</option>` + POS.map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("");
$("#f-dep").innerHTML = Object.entries(SPORTS).map(([k,v])=>`<option value="${k}">${esc(v.nombre)}</option>`).join("");
$("#f-dep-wrap").hidden = Object.keys(SPORTS).length < 2;

/* ---------- rutas ---------- */
function route(){
  const v = location.hash === "#mi-ficha" ? "mi-ficha" : "explorar";
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.view === v));
  $("#view-explorar").hidden = v !== "explorar";
  $("#view-mi-ficha").hidden = v !== "mi-ficha";
  if (v === "mi-ficha") renderMine();
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { location.hash = t.dataset.view; }));
addEventListener("hashchange", route);

/* ---------- tarjeta ---------- */
function photoHTML(p){
  const id = assetId(p.foto);
  return `<div class="photo"><div class="ph" aria-hidden="true">${esc(initials(p.nombre))}</div>${id ? `<img src="${blobSrc(id)}" alt="" loading="lazy" onerror="this.remove()">` : ""}${num(p.dorsal)!==null && p.dorsal!=="" ? `<div class="dorsal">${esc(p.dorsal)}</div>` : ""}${POSMAP[p.posicion] ? `<div class="pos" title="${esc(POSMAP[p.posicion])}">${esc(p.posicion)}</div>` : ""}</div>`;
}
function cardHTML(p, asButton = true){
  const a = age(p.fechaNac);
  const tag = asButton ? "button" : "div";
  return `<${tag} class="pcard" ${asButton?`type="button" data-id="${esc(p._id)}"`:""}>
    ${photoHTML(p)}
    <div class="pbody">
      <div class="pname">${esc(p.nombre || "Tu nombre")}</div>
      <div class="pmeta">${esc(POSMAP[p.posicion] || "Posición")} · ${esc(placeOf(p) || "Ciudad")}</div>
      ${DISP[p.disponibilidad] ? `<div class="status st-${esc(p.disponibilidad)}">${esc(DISP[p.disponibilidad])}</div>` : ""}
      <div class="specs">
        <div><span>Edad</span><b>${a ?? "–"}</b></div>
        <div><span>Altura</span><b>${num(p.altura) ? (p.altura/100).toFixed(2)+" m" : "–"}</b></div>
        <div><span>Pie</span><b>${esc(p.pie ? p.pie.slice(0,3).toUpperCase() : "–")}</b></div>
      </div>
    </div></${tag}>`;
}

/* ---------- explorar ---------- */
function renderGrid(){
  const grid = $("#grid"), count = $("#count");
  if (!S.ready){ count.textContent = "Cargando fichas…"; return; }
  if (!S.db){
    count.textContent = "";
    grid.innerHTML = `<div class="empty"><h2>Fichas no disponibles</h2><p>Para ver las fichas tenés que abrir esta página con tu cuenta iniciada.</p></div>`;
    return;
  }
  if (!S.loaded){ count.textContent = "Cargando fichas…"; return; }
  const q = $("#f-q").value.trim().toLowerCase(), pais = $("#f-pais").value, ue = $("#f-ue").checked, pos = $("#f-pos").value, prov = $("#f-prov").value, pie = $("#f-pie").value, libres = $("#f-libres").checked;
  const dep = $("#f-dep").value || DEPORTE;
  const all = S.players.filter(p => p.publicado && p.nombre && (p.deporte || "futbol") === dep);
  const list = all.filter(p =>
    (!pos || p.posicion === pos || (Array.isArray(p.posSec) && p.posSec.includes(pos))) &&
    (!pais || paisOf(p) === pais) && (!prov || p.provincia === prov) && (!ue || p.pasaporteUE === true) && (!pie || p.pie === pie) && (!libres || p.disponibilidad === "libre") &&
    (!q || [p.nombre,p.apodo,p.ciudad,p.provincia,p.clubActual,cName(paisOf(p)||"")].join(" ").toLowerCase().includes(q)));
  if (!all.length){
    count.textContent = "0 jugadores";
    grid.innerHTML = `<div class="empty"><h2>Todavía no hay fichas publicadas</h2><p>Acá van a aparecer los jugadores con su foto, posición, trayectoria y videos. Si jugás, cargá tu ficha y sé el primero que ven los clubes.</p><a class="btn primary" href="#mi-ficha">Cargar mi ficha</a></div>`;
    return;
  }
  count.textContent = `${list.length} de ${all.length} jugador${all.length===1?"":"es"}`;
  grid.innerHTML = list.length ? `<div class="grid">${list.map(p=>cardHTML(p)).join("")}</div>`
    : `<div class="empty"><h2>Sin resultados</h2><p>Ningún jugador coincide con esos filtros. Probá ampliar la posición o la provincia.</p></div>`;
}
$("#grid").addEventListener("click", e => {
  const b = e.target.closest(".pcard[data-id]"); if (!b) return;
  const p = S.players.find(x => x._id === b.dataset.id); if (p) openDetail(p);
});

        <div class="pmeta">${esc(["Nacionalidad: " + [natName(p.nacionalidad), natName(p.nacionalidad2)].filter(Boolean).join(" y "), p.pasaporteUE ? "Pasaporte UE" : ""].filter(x => x && x !== "Nacionalidad: ").join(" · "))}</div>
        ${DISP[p.disponibilidad] ? `<div class="status st-${esc(p.disponibilidad)}" style="color:var(--accent)">${esc(DISP[p.disponibilidad])}</div>` : ""}
        <div class="kv">
          <div><span>Edad</span><b>${a ?? "–"}</b></div>
          <div><span>Altura</span><b>${num(p.altura) ? esc(p.altura)+" cm" : "–"}</b></div>
          <div><span>Peso</span><b>${num(p.peso) ? esc(p.peso)+" kg" : "–"}</b></div>
          <div><span>Pie hábil</span><b>${esc(p.pie || "–")}</b></div>
          <div><span>Club actual</span><b>${esc(p.clubActual || "Sin club")}</b></div>
        </div>
      </div>
      <button class="closex" type="button" aria-label="Cerrar">×</button>
    </div>
    <div class="dbody">
      <div>
        <h3>Última temporada${p.temporada ? " · " + esc(p.temporada) : ""}</h3>
        <div class="stats">
          <div><b>${num(st.partidos) ?? "–"}</b><span>Partidos</span></div>
          <div><b>${num(st.goles) ?? "–"}</b><span>Goles</span></div>
          <div><b>${num(st.asistencias) ?? "–"}</b><span>Asistencias</span></div>
          <div><b>${num(st.vallas) ?? "–"}</b><span>${p.posicion==="ARQ"?"Vallas invictas":"Títulos"}</span></div>
        </div>
      </div>
      ${vids.length ? `<div><h3>Videos</h3><div class="vids">${vids.map(videoHTML).join("")}</div></div>` : ""}
      <div class="two">
        <div><h3>Trayectoria</h3>${traj.length ? `<ul class="timeline">${traj.map(t=>`<li><div class="yrs">${esc(t.desde||"?")}–${esc(t.hasta||"hoy")}</div><div><div class="club">${esc(t.club)}</div><div class="cat">${esc(t.categoria||"")}${t.logros?" · "+esc(t.logros):""}</div></div></li>`).join("")}</ul>` : `<p class="pmeta">Sin trayectoria cargada.</p>`}</div>
        <div style="display:grid;gap:20px;align-content:start">
          ${traits.length ? `<div><h3>Cualidades</h3><div class="traits">${traits.map(t=>`<span>${esc(t)}</span>`).join("")}</div></div>` : ""}
          ${p.bio ? `<div><h3>Sobre mí</h3><p class="bio">${esc(p.bio)}</p></div>` : ""}
        </div>

      <div>

function videoHTML(v){
  if (!v) return "";
  const t = esc(v.titulo || "Video");
  if (v.tipo === "archivo" && assetId(v.id)) return `<div class="vid"><video controls preload="metadata" playsinline src="${blobSrc(assetId(v.id))}"></video><div class="vt">${t}</div></div>`;
  const u = safeUrl(v.url);
  if (u) { let host = ""; try { host = new URL(u).hostname.replace(/^www\./,""); } catch {} return `<div class="vid"><a class="vlink" href="${esc(u)}" target="_blank" rel="noopener"><span class="play" aria-hidden="true"></span><span><b>${t}</b><small>${esc(host)}</small></span></a></div>`; }
  return "";
}
$("#detail").addEventListener("click", e => {
  if (e.target === e.currentTarget) e.currentTarget.close();
  const b = e.target.closest("[data-copy]");
  if (b){ const txt = b.dataset.copy;
    navigator.clipboard?.writeText(txt).then(()=>{ b.textContent="Copiado"; setTimeout(()=>b.textContent="Copiar",1500); })
      .catch(()=>{ const code = b.parentElement.querySelector("code"); const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
  }
});

/* ---------- mi ficha ---------- */
function blank(){
  return { deporte: DEPORTE, nombre:"", apodo:"", fechaNac:"", nacionalidad:"AR", nacionalidad2:"", pais:"AR", ciudad:"", provincia:"", pasaporteUE:false, dorsal:"", posicion:"", posSec:[], pie:"", altura:"", peso:"", clubActual:"", disponibilidad:"libre",
    temporada:"", stats:{partidos:"",goles:"",asistencias:"",vallas:""}, trayectoria:[{club:"",categoria:"",desde:"",hasta:"",logros:""}], cualidades:[], bio:"",
    foto:"", videos:[], contacto:{telefono:"",email:"",instagram:""}, publicado:true };
}
function fromDoc(d){ const b = blank(); const x = Object.assign(b, JSON.parse(JSON.stringify(d||{}))); x.stats = Object.assign(blank().stats, x.stats||{}); x.contacto = Object.assign(blank().contacto, x.contacto||{});
  x.pais = paisOf(x); if (x.provincia === "Fuera de Argentina") x.provincia = ""; x.nacionalidad = natCode(x.nacionalidad); x.nacionalidad2 = natCode(x.nacionalidad2); x.pasaporteUE = x.pasaporteUE === true;
  ["posSec","cualidades","videos","trayectoria"].forEach(k => { if (!Array.isArray(x[k])) x[k] = []; }); if (!x.trayectoria.length) x.trayectoria = blank().trayectoria; delete x._id; return x; }

async function shrinkImage(file){
  try {
    const bmp = await createImageBitmap(file);
    const max = 1400, s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.86));
  } catch { return file; }
}
function upErr(e){
  const c = e && e.code;
  return c === "too_large" ? "El archivo es demasiado grande (máximo 20 MB)."
    : c === "unsupported_type" ? "Ese formato no se puede subir. Usá JPG/PNG para fotos y MP4 o WebM para videos."
    : c === "quota_or_state" ? "Se llenó el espacio de la página. Probá con un link en lugar de un archivo."
    : c === "rate_limited" ? "Demasiados intentos seguidos. Esperá un minuto y volvé a probar."
    : "No se pudo subir el archivo. Volvé a intentarlo.";
}
async function uploadPhoto(file){
  const m = $("#foto-msg"); m.textContent = "Subiendo foto…";
  try {
    const blob = await shrinkImage(file);
    const r = await S.assets.upload(blob, {type: blob.type && /^image\/(png|jpeg|gif|webp)$/.test(blob.type) ? blob.type : "image/jpeg"});
    S.draft.foto = r.id; $("#thumb").innerHTML = `<img src="${esc(r.url)}" alt="Tu foto">`; m.textContent = "Foto lista. Guardá para publicarla.";
    if (!$("#rm-foto")) m.insertAdjacentHTML("beforebegin", `<button type="button" class="btn sm danger" id="rm-foto">Quitar foto</button>`);
    touch();
  } catch(e){ m.textContent = upErr(e); }
}
async function uploadVideo(file){
  const m = $("#v-msg");
  const type = /webm$/i.test(file.name) || file.type === "video/webm" ? "video/webm" : (/mp4$/i.test(file.name) || file.type === "video/mp4" ? "video/mp4" : "");
  if (!type){ m.textContent = "Usá un archivo MP4 o WebM. Los videos .MOV del iPhone conviene subirlos a YouTube y pegar el link."; return; }
  if (file.size > 20*1024*1024){ m.textContent = `El clip pesa ${(file.size/1048576).toFixed(1)} MB y el máximo es 20 MB. Recortalo o subilo a YouTube y pegá el link.`; return; }
  m.textContent = "Subiendo clip…";
  try {
    const r = await S.assets.upload(file, {type});
    S.draft.videos.push({tipo:"archivo", id:r.id, titulo: file.name.replace(/\.[^.]+$/,"").slice(0,60)});
    refreshVideos(); touch();
  } catch(e){ m.textContent = upErr(e); }
}
function clean(D){

  return {

    ciudad: D.ciudad.trim().slice(0,50), provincia: D.pais === "AR" ? (PROV.includes(D.provincia) ? D.provincia : "") : String(D.provincia || "").trim().slice(0,50),

    pie: ["derecho","izquierdo","ambidiestro"].includes(D.pie) ? D.pie : "", altura: n(D.altura), peso: n(D.peso),

    cualidades: D.cualidades.filter(t=>TRAITS.includes(t)), bio: D.bio.trim().slice(0,800), foto: assetId(D.foto),
    videos: D.videos.slice(0,MAX_VIDEOS).map(v => v.tipo==="archivo" ? {tipo:"archivo", id:assetId(v.id), titulo:String(v.titulo||"").slice(0,60)} : {tipo:"link", url:safeUrl(v.url), titulo:String(v.titulo||"").slice(0,60)}).filter(v=>v.id||v.url),
    contacto: {telefono:D.contacto.telefono.trim().slice(0,25), email:D.contacto.email.trim().slice(0,80), instagram:D.contacto.instagram.trim().slice(0,40)},

  };

const LS_KEY = "fa_players_v1", urls = new Map();
const blobSrc = id => urls.get(id) || "";
let idb = null;
function openIDB(){ return new Promise(res => { try { const r = indexedDB.open("fichaje-abierto", 1); r.onupgradeneeded = () => r.result.createObjectStore("blobs"); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch { res(null); } }); }
function idbAll(){ return new Promise(res => { if (!idb) return res([]); const out = []; const c = idb.transaction("blobs").objectStore("blobs").openCursor(); c.onsuccess = () => { const cur = c.result; if (cur){ out.push([cur.key, cur.value]); cur.continue(); } else res(out); }; c.onerror = () => res(out); }); }
function idbPut(id, blob){ return new Promise((res, rej) => { if (!idb) return rej({code:"capability_disabled"}); const t = idb.transaction("blobs","readwrite"); t.objectStore("blobs").put(blob, id); t.oncomplete = res; t.onerror = () => rej({code:"quota_or_state"}); }); }
function idbClear(){ return new Promise(res => { if (!idb) return res(); const t = idb.transaction("blobs","readwrite"); t.objectStore("blobs").clear(); t.oncomplete = res; t.onerror = res; }); }
const readAll = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch { return {}; } };
const writeAll = o => { try { localStorage.setItem(LS_KEY, JSON.stringify(o)); return true; } catch { return false; } };
const listeners = new Set();
const snap = () => { const all = readAll(); const docs = Object.entries(all).sort((a,b)=>(b[1].actualizado||0)-(a[1].actualizado||0)).map(([id,d]) => ({id, exists:true, data:()=>d})); return {docs, size:docs.length, empty:!docs.length}; };
const emit = () => { const s = snap(); listeners.forEach(fn => fn(s)); };
addEventListener("storage", e => { if (e.key === LS_KEY) emit(); });
const localDB = {
  collection(){ const q = { orderBy(){ return q; }, limit(){ return q; }, onSnapshot(fn){ listeners.add(fn); setTimeout(()=>fn(snap())); return () => listeners.delete(fn); } }; return q; },
  doc(path){ const id = path.split("/")[1]; return {
    async get(){ const d = readAll()[id]; return {id, exists:!!d, data:()=>d}; },
    async set(data){ const all = readAll(); all[id] = data; if (!writeAll(all)) throw {code:"quota_exceeded"}; emit(); },
    async delete(){ const all = readAll(); delete all[id]; writeAll(all); emit(); } }; }
};
const localAssets = { async upload(blob){ const id = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2,"0")).join(""); await idbPut(id, blob); const url = URL.createObjectURL(blob); urls.set(id, url); return {id, url, sizeBytes: blob.size, contentType: blob.type}; } };

    if (e.target.id === "demo-reset") $("#demo-reset-zone").innerHTML = `¿Borrar todas las fichas de este navegador? <button type="button" class="btn sm danger" id="demo-yes">Sí</button> <button type="button" class="btn sm" id="demo-no">No</button>`;

    if (e.target.id === "demo-yes"){ writeAll({}); await idbClear(); urls.clear(); S.myDoc = null; S.draft = null; emit(); $("#demo-reset-zone").innerHTML = `<button type="button" class="btn sm danger" id="demo-reset">Borrar todo</button>`; if (location.hash === "#mi-ficha") renderMine(); }
  });
}

/* ---------- arranque ---------- */
route(); renderGrid();
async function boot(){
  demoBar();
  idb = await openIDB();
  for (const [id, blob] of await idbAll()) urls.set(id, URL.createObjectURL(blob));
  S.db = localDB; S.assets = idb ? localAssets : null; S.uid = "yo"; S.canWrite = true; S.ready = true;
  const mine = await localDB.doc("players/yo").get(); S.myDoc = mine.exists ? mine.data() : null; S.mineLoaded = true;
  localDB.collection("players").onSnapshot(s => { S.players = s.docs.map(d => Object.assign({}, d.data(), {_id: d.id})); S.loaded = true; renderGrid(); });
  renderGrid(); if (location.hash === "#mi-ficha") renderMine();
}
boot();
})();
</script>
