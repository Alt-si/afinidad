async function savePlayer(d){
  S.saving = true;
  try {
    const perfil = d.perfil || "jugador";
    const tutor = S.draft && "autorizaTutor" in S.draft ? !!S.draft.autorizaTutor : !!(d.autorizaTutor || (S.myDoc && S.myDoc.autorizaTutor));
    const edad = age(d.fechaNac);
    if (edad !== null && edad < 18 && !tutor) throw {userMsg: "Sos menor de 18: para guardar la ficha marcá que tu padre, madre o tutor la autoriza (abajo de la fecha de nacimiento)."};
    await ensureCuenta(perfil);
    const {temporadas, fichaje, clubes, exclubes, rechazados, inv, _id, actualizado, deporte, publicado, licencia, habilitado, carnetVigente, ...rest} = d;
    const vig = /^\d{4}-\d{2}$/.test(d.vigencia || "") ? d.vigencia : "";
    const seasons = (Array.isArray(temporadas) ? temporadas : []).filter(t => t && (String(t.club || "").trim() || String(t.anio || "").trim()));
    for (const t of seasons){
      if (!/^\d{4}/.test(String(t.anio || "").trim()) || !String(t.club || "").trim()) throw {userMsg: "Cada temporada necesita el año (por ejemplo 2026) y el club."};
    }
    await api("jugadores?on_conflict=id", {method: "POST", prefer: "resolution=merge-duplicates,return=minimal", body: {
      id: ME, perfil, deporte: deporte || "futbol", publicado: publicado !== false,
      licencia: nil(licencia), habilitado: nil(habilitado), carnet_vigente: !!carnetVigente, carnet_vence: vig ? vig + "-01" : null,
      datos: Object.assign(rest, {autorizaTutor: tutor}), actualizado: iso()
    }});
    await api("temporadas?persona_id=" + eq(ME), {method: "DELETE"});
    if (seasons.length) await api("temporadas", {method: "POST", prefer: "return=minimal", body: seasons.slice(0, 30).map(t => ({
      persona_id: ME, anio: String(t.anio).trim().slice(0, 9), club: String(t.club).trim().slice(0, 60), categoria: nil(t.categoria), rol: nil(t.rol),
      s1: nil(t.s1), s2: nil(t.s2), s3: nil(t.s3), s4: nil(t.s4), resultado: nil(t.resultado), comentario: nil(t.comentario)
    }))});
    const cur = RAW.fich.get(ME);
    if (fichaje && fichaje.club && fichaje.h){
      if (!cur || cur.token_hash !== fichaje.h){
        if (cur) await api("fichajes?jugador_id=" + eq(ME), {method: "DELETE"});
        await api("fichajes", {method: "POST", prefer: "return=minimal", body: {jugador_id: ME, club: fichaje.club, fecha: fichaje.fecha, tipo: fichaje.tipo || "fichaje", token_hash: fichaje.h}});
      }
    } else if (cur) await api("fichajes?jugador_id=" + eq(ME), {method: "DELETE"});
    for (const row of RAW.plantel.filter(x => x.jugador_id === ME)){
      const want = (clubes || []).includes(row.club_id) ? "aceptado" : (exclubes || []).includes(row.club_id) ? "ex" : (rechazados || []).includes(row.club_id) ? "rechazado" : row.estado;
      if (want !== row.estado) await api("plantel?club_id=" + eq(row.club_id) + "&jugador_id=" + eq(ME), {method: "PATCH", body: {estado: want}, prefer: "return=minimal"});
    }
    const known = new Set(RAW.pedidos.map(x => x.token_hash));
    for (const i of (inv || [])) if (i && i.h && !known.has(i.h)) await api("pedidos_referencia", {method: "POST", prefer: "return=minimal", body: {jugador_id: ME, club: String(i.club || "").slice(0, 60), token_hash: i.h}});
    await loadAll();
  } finally { S.saving = false; }
}
async function saveClub(d){
  S.saving = true;
  try {
    await ensureCuenta("club");
    const {posts, plantel, _id, nombre, deporte, actualizado, ...rest} = d;
    await api("clubes?on_conflict=id", {method: "POST", prefer: "resolution=merge-duplicates,return=minimal", body: {id: ME, nombre: String(nombre || "").trim(), deporte: deporte || "futbol", datos: rest, actualizado: iso()}});
    const curPosts = RAW.pubs.filter(x => x.club_id === ME), want = Array.isArray(posts) ? posts : [];
    const curIds = new Set(curPosts.map(x => x.id)), wantIds = new Set(want.map(x => x.id));
    for (const po of want) if (!curIds.has(po.id)) await api("publicaciones", {method: "POST", prefer: "return=minimal", body: {
      id: /^[0-9a-f-]{36}$/.test(po.id) ? po.id : undefined, club_id: ME, tipo: po.tipo, titulo: po.titulo, texto: po.texto,
      fecha_evento: nil(po.fechaEvento), hora: nil(po.hora), lugar: nil(po.lugar)
    }});
    for (const x of curPosts) if (!wantIds.has(x.id)) await api("publicaciones?id=" + eq(x.id), {method: "DELETE"});
    const curPl = RAW.plantel.filter(x => x.club_id === ME), wantPl = Array.isArray(plantel) ? plantel.map(x => x.p) : [];
    const curJ = new Set(curPl.map(x => x.jugador_id));
    for (const pid of wantPl) if (!curJ.has(pid)) await api("plantel", {method: "POST", prefer: "return=minimal", body: {club_id: ME, jugador_id: pid}});
    for (const x of curPl) if (!wantPl.includes(x.jugador_id)) await api("plantel?club_id=" + eq(ME) + "&jugador_id=" + eq(x.jugador_id), {method: "DELETE"});
    await loadAll();
  } finally { S.saving = false; }
}
async function saveReviews(d){
  S.saving = true;
  try {
    for (const [tok, r] of Object.entries(d.given || {})) await api("rpc/dejar_referencia", {method: "POST", body: {p_token: tok, p_estrellas: +r.estrellas, p_texto: r.texto, p_firma: r.firma}});
    for (const [tok, r] of Object.entries(d.confirma || {})) await api("rpc/confirmar_fichaje", {method: "POST", body: {p_token: tok, p_quien: r.quien}});
    const mineOps = new Map(RAW.ops.filter(o => o.autor_id === ME).map(o => [o.staff_id, o]));
    for (const [sid, r] of Object.entries(d.opina || {})){
      const cur = mineOps.get(sid);
      if (!cur) await api("opiniones", {method: "POST", prefer: "return=minimal", body: {autor_id: ME, staff_id: sid, club_id: r.club, estrellas: +r.estrellas, texto: r.texto}});
      else if (cur.estrellas !== +r.estrellas || cur.texto !== r.texto) await api("opiniones?autor_id=" + eq(ME) + "&staff_id=" + eq(sid), {method: "PATCH", prefer: "return=minimal", body: {estrellas: +r.estrellas, texto: r.texto}});
    }
    await loadAll();
  } finally { S.saving = false; }
}
const sbdb = {
  doc(path){
    const kind = path.split("/")[0];
    return {
      async get(){
        if (kind === "players") return {exists: !!S.myDoc, data: () => S.myDoc};
        if (kind === "clubs") return {exists: !!S.myClub, data: () => S.myClub};
        if (kind === "reviews") return {exists: true, data: () => ({opina: Object.assign({}, (S.reviewDocs[0] || {}).opina || {})})};
        return {exists: false, data: () => undefined};
      },
      async set(data){
        if (kind === "players") return savePlayer(data);
        if (kind === "clubs") return saveClub(data);
        if (kind === "reviews") return saveReviews(data);
      },
      async update(patch){
        if (kind === "players") return savePlayer(Object.assign({}, S.myDoc || {}, patch));
        if (kind === "clubs") return saveClub(Object.assign({}, S.myClub || {}, patch));
      },
      async delete(){
        if (kind === "players"){ await api("jugadores?id=" + eq(ME), {method: "DELETE"}); await loadAll(); }
      }
    };
  }
};
async function makeThumb(blob){
  const bmp = await createImageBitmap(blob), sc = Math.min(1, 360 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(b => r(b), "image/jpeg", 0.72));
}
async function putFoto(path, blob, type){
  await refreshIfNeeded();
  return fetch(SBU + "/storage/v1/object/fotos/" + path, {method: "POST", headers: {apikey: SBK, authorization: "Bearer " + session.access_token, "content-type": type, "x-upsert": "true", "cache-control": "max-age=31536000"}, body: blob});
}
const sbAssets = {
  async upload(blob, opts){
    const type = (opts && opts.type) || blob.type || "image/jpeg";
    if (!/^image\/(jpeg|png|webp)$/.test(type)) throw {code: "unsupported_type"};
    if (blob.size > 2 * 1024 * 1024) throw {code: "too_large"};
    const ext = type === "image/png" ? "png" : type === "image/webp" ? "webp" : "jpg";
    const path = ME + "/" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) + "." + ext;
    const r = await putFoto(path, blob, type);
    if (!r.ok) throw {code: r.status === 413 ? "too_large" : r.status === 415 ? "unsupported_type" : "upstream_error"};
    try { const t = await makeThumb(blob); if (t) await putFoto(thumbPath(path), t, "image/jpeg"); } catch {}
    return {id: path, url: blobSrc(path)};
  }
};

function handleAuthFragment(){

    const t = pr.get("type");

  } else {

    S.authNote = "error:" + (/expired|invalid/i.test(d + pr.get("error_code")) ? "El link venció o ya se usó. Ingresá con tu correo y contraseña, o pedí un mail nuevo." : (d || "No se pudo validar el link."));
  }
  let back = ""; try { back = sessionStorage.getItem(BACK_KEY) || ""; sessionStorage.removeItem(BACK_KEY); } catch {}

function authErr(e){

  if (/invalid_credentials|invalid login/.test(c)) return "El correo o la contraseña no son correctos.";
  if (/user_already_exists|already registered/.test(c)) return "Ese correo ya tiene una cuenta. Ingresá con tu contraseña.";
  if (/weak_password|at least|password should/.test(c)) return "La contraseña tiene que tener al menos 6 caracteres.";
  if (/rate_limit|over_email_send_rate|too many/.test(c)) return "Se alcanzó el límite de mails por hora. Probá de nuevo más tarde.";
  if (/not_authorized|not authorized/.test(c)) return "Por ahora solo pueden registrarse correos autorizados: la app está en pruebas.";
  if (/validation_failed|invalid format|email address/.test(c)) return "Revisá que el correo esté bien escrito.";
  return "No se pudo completar. Revisá tu conexión y volvé a intentar.";
}

      </div>
      <form id="auth-form" novalidate>
        <label class="fld" style="margin-bottom:12px"><span class="lbl">Correo</span><input type="email" id="au-mail" autocomplete="email" maxlength="120" value="${esc(S.authEmail || "")}"></label>
        <label class="fld" style="margin-bottom:12px"><span class="lbl">Contraseña${reg ? " (mínimo 6 caracteres)" : ""}</span><input type="password" id="au-pass" autocomplete="${reg ? "new-password" : "current-password"}" maxlength="72"></label>
        ${reg ? `<label class="fld" style="margin-bottom:12px"><span class="lbl">Repetí la contraseña</span><input type="password" id="au-pass2" autocomplete="new-password" maxlength="72"></label>
        <label class="chk legalchk"><input type="checkbox" id="au-terms"><span>Leí y acepto los <a href="#terminos" target="_blank" rel="noopener">términos y la política de privacidad</a>.</span></label>
        <label class="chk legalchk"><input type="checkbox" id="au-edad"><span>Tengo 18 años o más, o tengo la autorización de mi padre, madre o tutor.</span></label>` : ""}
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button type="submit" class="btn primary" id="au-send">${reg ? "Crear cuenta" : "Ingresar"}</button>
          ${reg ? "" : `<button type="button" class="btn sm" id="au-forgot">Olvidé mi contraseña</button>`}
          <button type="button" class="btn sm" id="au-resend" hidden>Reenviar mail de validación</button>
        </div>
        <p class="note" id="au-msg" role="status"></p>
      </form>
    </div>
    <p class="note">Para ver fichas, entrenadores, profes y clubes no hace falta cuenta. Para cargar tu ficha o la de tu club, creá una cuenta gratis y validá tu correo.</p>
  </div>`;
}
function recoveryHTML(){
  return `<div class="authwrap"><div class="sec"><h2>Elegí tu nueva contraseña</h2><p class="hint">Escribila dos veces. Mínimo 6 caracteres.</p>
    <form id="pw-form" novalidate>
      <label class="fld" style="margin-bottom:12px"><span class="lbl">Nueva contraseña</span><input type="password" id="pw-1" autocomplete="new-password" maxlength="72"></label>
      <label class="fld" style="margin-bottom:12px"><span class="lbl">Repetila</span><input type="password" id="pw-2" autocomplete="new-password" maxlength="72"></label>
      <button type="submit" class="btn primary">Guardar contraseña</button>
      <p class="note" id="pw-msg" role="status"></p>
    </form></div></div>`;
}
function renderAcctBar(){ const b = $("#acctbar"); if (b) b.innerHTML = acctBarHTML(); }
function renderMine(){
  const box = $("#mine");
  renderAcctBar();
  if (!S.ready){ box.innerHTML = `<p class="loading">Preparando tu cuenta…</p>`; return; }
  if (!ME){ box.innerHTML = authHTML(); return; }
  if (S.authNote === "recovery"){ box.innerHTML = recoveryHTML(); return; }
  if (S.loadError && !S.mineLoaded){ box.innerHTML = loadErrorHTML(); return; }
  renderMineBase();
  if (!S.myDoc && !S.myClub && !S.account && $("#mine .chooser")) $("#mine .chooser").insertAdjacentHTML("afterend", `<p class="note">Elegí con cuidado: después no se puede cambiar el tipo de cuenta.</p>`);
}
async function afterLogin(){
  ME = session && session.user ? session.user.id : null;
  S.assets = ME ? sbAssets : null; S.draft = null; S.clubDraft = null; S.mineLoaded = false;
  try { await loadAll(); } catch(e){ S.loadError = e; }
  let back = ""; try { back = sessionStorage.getItem(BACK_KEY) || ""; sessionStorage.removeItem(BACK_KEY); } catch {}
  if (back && back !== location.hash) location.hash = back; else { route(); }
  updateBell();
  let open = ""; try { open = sessionStorage.getItem(OPEN_KEY) || ""; sessionStorage.removeItem(OPEN_KEY); } catch {}
  if (open && ME){
    const [k, id] = open.split(":"), x = k === "club" ? S.clubs.find(c => c._id === id) : playerById(id);
    if (x) setTimeout(() => k === "club" ? openClub(x) : openDetail(x), 150);
  }
}
document.addEventListener("click", async e => {
  const back = e.target.closest("[data-back]"); if (back){ try { sessionStorage.setItem(BACK_KEY, back.dataset.back); } catch {} }
  const op = e.target.closest("[data-open]"); if (op){ try { sessionStorage.setItem(OPEN_KEY, op.dataset.open); } catch {} }
  const am = e.target.closest("[data-auth-mode]"); if (am){ S.authMode = am.dataset.authMode; const dd = $("#detail"); if (dd.open) dd.close(); }
  const tab = e.target.closest("[data-auth]"); if (tab){ S.authMode = tab.dataset.auth; S.authEmail = ($("#au-mail") || {}).value || S.authEmail; renderMine(); return; }
  if (e.target.id === "logout"){
    try { await authFetch("/logout", null, "POST", true); } catch {}
    saveSession(null); ME = null; S.assets = null; S.myDoc = null; S.myClub = null; S.draft = null; S.clubDraft = null; S.role = null; S.account = null; S.authNote = "";
    S.priv = {tokens: {}, fichaje: "", visto: 0, miembrosVistos: []}; S.privLoaded = false;
    await reload(); route(); updateBell(); return;
  }
  if (e.target.id === "au-forgot"){
    const mail = $("#au-mail").value.trim(), out = $("#au-msg");
    if (!/^\S+@\S+\.\S+$/.test(mail)){ out.textContent = "Escribí tu correo y tocá de nuevo “Olvidé mi contraseña”."; $("#au-mail").focus(); return; }
    e.target.disabled = true;
    try { await authFetch("/recover?redirect_to=" + authRedirect(), {email: mail}); out.textContent = "Si ese correo tiene cuenta, te llegó un mail para elegir una contraseña nueva."; }
    catch(err){ out.textContent = authErr(err); }
    e.target.disabled = false; return;
  }
  if (e.target.id === "au-resend"){
    const mail = $("#au-mail").value.trim(), out = $("#au-msg"); e.target.disabled = true;
    try { await authFetch("/resend?redirect_to=" + authRedirect(), {type: "signup", email: mail}); out.textContent = "Listo, te reenviamos el mail de validación."; }
    catch(err){ out.textContent = authErr(err); }
    e.target.disabled = false;
  }
});
document.addEventListener("submit", async e => {
  if (e.target.id === "auth-form"){
    e.preventDefault();
    const reg = S.authMode === "registro", mail = $("#au-mail").value.trim(), pass = $("#au-pass").value, out = $("#au-msg"), b = $("#au-send");
    S.authEmail = mail;
    if (!/^\S+@\S+\.\S+$/.test(mail)){ out.textContent = "Revisá que el correo esté bien escrito."; $("#au-mail").focus(); return; }
    if (pass.length < 6){ out.textContent = "La contraseña tiene que tener al menos 6 caracteres."; $("#au-pass").focus(); return; }
    if (reg && pass !== $("#au-pass2").value){ out.textContent = "Las contraseñas no coinciden."; $("#au-pass2").focus(); return; }
    if (reg && !$("#au-terms").checked){ out.textContent = "Para crear la cuenta tenés que aceptar los términos y la política de privacidad."; return; }
    if (reg && !$("#au-edad").checked){ out.textContent = "Si sos menor de 18, necesitás la autorización de tu padre, madre o tutor. Marcá la casilla cuando la tengas."; return; }
    b.disabled = true; out.textContent = reg ? "Creando tu cuenta…" : "Ingresando…";
    try {
      if (reg){
        const r = await authFetch("/signup?redirect_to=" + authRedirect(), {email: mail, password: pass, data: {terminos: TERMINOS_VERSION, mayor_o_autorizado: true}});
        if (r && r.access_token){ saveSession(sessFromToken(r)); S.authNote = ""; await afterLogin(); return; }
        S.authNote = "sent:" + mail; S.authMode = "login"; renderMine(); return;
      }
      const t = await authFetch("/token?grant_type=password", {email: mail, password: pass});
      saveSession(sessFromToken(t)); S.authNote = ""; await afterLogin();
    } catch(err){
      b.disabled = false; out.textContent = authErr(err);
      if (/not confirmed|email_not_confirmed/i.test((err && err.code) + " " + (err && err.message))) $("#au-resend").hidden = false;
    }
  }
  if (e.target.id === "pw-form"){
    e.preventDefault();
    const a = $("#pw-1").value, b2 = $("#pw-2").value, out = $("#pw-msg");
    if (a.length < 6){ out.textContent = "Mínimo 6 caracteres."; return; }
    if (a !== b2){ out.textContent = "Las contraseñas no coinciden."; return; }
    try { await refreshIfNeeded(); await authFetch("/user", {password: a}, "PUT", true); S.authNote = ""; out.textContent = "Contraseña actualizada."; await afterLogin(); }
    catch(err){ out.textContent = authErr(err); }
  }
});
function loadErrorHTML(){
  const e = S.loadError || {};
  const missing = e.code === "42P01" || e.code === "PGRST205" || /does not exist|schema cache/i.test(e.message || "");
  return `<div class="empty"><h2>${missing ? "Falta preparar la base de datos" : "No se pudieron cargar los datos"}</h2><p>${missing ? "La base de datos todavía no tiene las tablas. Hay que correr el archivo esquema.sql en el SQL Editor de Supabase." : "Revisá tu conexión y recargá la página. Si el problema sigue, puede que el proyecto de Supabase esté pausado por inactividad."}</p></div>`;
}
function loginNeededHTML(title, txt){
  return `<div class="empty"><h2>${esc(title)}</h2><p>${esc(txt)}</p><a class="btn primary" href="#mi-ficha" data-back="${esc(location.hash)}">Ingresar o crear cuenta</a></div>`;
}

/* ---------- términos, privacidad y menores ---------- */
const CONTACTO_MAIL = window.FA_CONTACTO || "";
const TERMINOS_VERSION = "2026-10-30";
function route(){
  const t = location.hash === "#terminos", sec = $("#view-terminos");
  if (sec) sec.hidden = !t;
  if (t){
    document.querySelectorAll("main section[id^='view-']").forEach(x => { if (x.id !== "view-terminos") x.hidden = true; });
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", "false"));
    scrollTo(0, 0); return;
  }
  routeBase();
}
const contactoTxt = () => CONTACTO_MAIL ? `escribinos a <a href="mailto:${esc(CONTACTO_MAIL)}">${esc(CONTACTO_MAIL)}</a>` : "escribinos por los canales de contacto de Fichaje Abierto";
function footerHTML(){
  return `<footer class="sitefoot"><div class="wrap"><span>Fichaje Abierto · La vitrina del deporte</span><a href="#terminos">Términos y privacidad</a></div></footer>`;
}
function termsSectionHTML(){
  return `<section id="view-terminos" hidden aria-labelledby="terminos-title"><div class="legal">
  <h1 id="terminos-title">Términos y privacidad</h1>
  <p class="upd">Última actualización: 30 de octubre de 2026.</p>

  <h2>1. Qué es Fichaje Abierto</h2>
  <p>Fichaje Abierto es una vitrina gratuita donde jugadores, entrenadores y preparadores físicos publican su ficha deportiva, y donde los clubes publican novedades y buscan refuerzos. No somos agentes, representantes ni intermediarios: no participamos de los acuerdos entre jugadores y clubes, no cobramos comisiones y no garantizamos que alguien sea contratado.</p>

  <h2>2. Tu cuenta</h2>
  <ul>
    <li>Necesitás un correo válido y validarlo para cargar una ficha o la cuenta de un club.</li>
    <li>Cada cuenta es de una sola persona o de un solo club. El tipo de cuenta (jugador, entrenador, profe o club) no se puede cambiar.</li>
    <li>Cuidá tu contraseña. Lo que se haga con tu cuenta es tu responsabilidad.</li>
  </ul>

  <h2>3. Lo que publicás</h2>
  <ul>
    <li>Los datos tienen que ser verdaderos. Licencias, títulos, carnets, estadísticas y trayectorias son <b>declarados por cada usuario</b>: Fichaje Abierto no los verifica. Antes de contratar, el club debe comprobarlos.</li>
    <li>Subí solo fotos tuyas o que tengas derecho a usar. Los videos se publican como links de YouTube y se rigen por las reglas de YouTube.</li>
    <li>Las referencias, las opiniones y los anuncios de fichaje tienen que ser verídicos y respetuosos. Podemos quitar contenido falso, ofensivo, discriminatorio o que exponga a otras personas, y suspender cuentas que lo publiquen.</li>
  </ul>

  <h2>4. Menores de edad</h2>
  <ul>
    <li>Un menor de 18 años solo puede tener ficha con la <b>autorización de su padre, madre o tutor</b>, que se marca al guardarla.</li>
    <li>En la ficha de un menor, el teléfono y el correo de contacto tienen que ser los del adulto responsable.</li>
    <li>Si el menor tiene menos de 13 años, la ficha la crea y la maneja el adulto responsable.</li>
    <li>Los clubes deben contactar siempre al adulto responsable, y ninguna prueba o reunión con un menor se hace sin su conocimiento.</li>
  </ul>

  <h2>5. Lo que no está permitido</h2>
  <ul>
    <li>Hacerse pasar por otra persona o club.</li>
    <li>Copiar datos de las fichas en forma masiva o usarlos para otra cosa que no sea el contacto deportivo (publicidad, bases de datos, spam).</li>
    <li>Pedir dinero a jugadores a cambio de pruebas o fichajes usando la plataforma.</li>
  </ul>

  <h2>6. Privacidad: qué datos guardamos</h2>
  <ul>
    <li><b>Tu cuenta:</b> correo y contraseña (la contraseña se guarda cifrada; nadie puede leerla).</li>
    <li><b>Tu ficha o la de tu club:</b> lo que cargás vos (nombre, fecha de nacimiento, lugar, puesto, trayectoria, temporadas, foto, links de videos y el contacto que elijas mostrar).</li>
    <li><b>En tu navegador:</b> solo lo necesario para mantener la sesión iniciada. No usamos cookies de publicidad.</li>
  </ul>

  <h2>7. Quién ve tus datos</h2>
  <ul>
    <li><b>Sin cuenta</b> se ve solo la tarjeta: nombre, foto, puesto, ciudad, edad, disponibilidad y valoración.</li>
    <li><b>Con cuenta</b> se ve la ficha completa, incluido el contacto que hayas cargado.</li>
    <li>Si ocultás o borrás tu ficha, deja de verse.</li>
    <li>No vendemos ni alquilamos tus datos.</li>
  </ul>
  <p>Los datos se guardan en Supabase, un servicio de bases de datos con servidores fuera de la Argentina, que los procesa solo para que la plataforma funcione.</p>

  <h2>8. Tus derechos</h2>
  <p>Podés ver, corregir u ocultar tu ficha cuando quieras desde Mi cuenta, y borrarla con el botón “Borrar ficha”. Para borrar la cuenta completa o hacer cualquier consulta sobre tus datos, ${contactoTxt()}.</p>
  <p>El titular de los datos personales tiene la facultad de ejercer el derecho de acceso a los mismos en forma gratuita a intervalos no inferiores a seis meses, salvo que se acredite un interés legítimo al efecto conforme lo establecido en el artículo 14, inciso 3 de la Ley N° 25.326. La Agencia de Acceso a la Información Pública, en su carácter de Órgano de Control de la Ley N° 25.326, tiene la atribución de atender las denuncias y reclamos que interpongan quienes resulten afectados en sus derechos por incumplimiento de las normas vigentes en materia de protección de datos personales.</p>

  <h2>9. Cambios</h2>
  <p>Si cambiamos estos términos, lo vamos a avisar en la página. Seguir usando Fichaje Abierto después del aviso implica aceptar los cambios.</p>
  <p><a class="btn" href="#inicio">Volver al inicio</a></p>
</div></section>`;
}
function tutorHTML(D){
  const a = age(D.fechaNac), on = "autorizaTutor" in D ? !!D.autorizaTutor : !!(S.myDoc && S.myDoc.autorizaTutor);
  return `<label class="tutorbox" id="tutorbox"${a !== null && a < 18 ? "" : " hidden"}><input type="checkbox" id="i-tutor"${on ? " checked" : ""}><span><b>Menor de 18 años:</b> mi padre, madre o tutor autoriza esta ficha, y el teléfono y el correo de contacto son los suyos.</span></label>`;
}
document.addEventListener("change", e => {
  if (e.target.id === "i-tutor" && S.draft){ S.draft.autorizaTutor = e.target.checked; touch(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "i-fnac"){ const b = $("#tutorbox"), a = age(e.target.value); if (b) b.hidden = !(a !== null && a < 18); }
});

/* ---------- arranque ---------- */
handleAuthFragment();
loadSession();
ME = session && session.user ? session.user.id : null;
S.db = sbdb; S.assets = ME ? sbAssets : null;
if (/pruebas/i.test(location.hostname) || window.FA_PRUEBAS) document.body.insertAdjacentHTML("afterbegin", `<div class="testbar"><div class="wrap"><span><b>SITIO DE PRUEBAS.</b> Acá ves los cambios antes de publicarlos en el sitio oficial.</span></div></div>`);
document.querySelector("main .wrap").insertAdjacentHTML("afterbegin", `<div id="loaderr"></div>`);
document.querySelector("main .wrap").insertAdjacentHTML("beforeend", termsSectionHTML());
document.querySelector("main").insertAdjacentHTML("afterend", footerHTML());
route();
(async function boot(){
  await refreshIfNeeded();
  ME = session && session.user ? session.user.id : null; S.assets = ME ? sbAssets : null;
  S.ready = true;
  try { await loadAll(); }
  catch(e){ S.loadError = e; S.loaded = S.clubsLoaded = S.reviewsLoaded = true; $("#loaderr").innerHTML = loadErrorHTML(); }
  route(); updateBell();
  // sin recarga automática: datos nuevos al navegar o al volver a la pestaña, si pasaron 5 minutos
  const fresh = () => { if (S.ready && !S.saving && Date.now() - (S.lastLoad || 0) > 300000) reload(); };
  addEventListener("hashchange", fresh);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") fresh(); });
})();
})();
</script>

</body>
</html>
