<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="La vitrina del deporte. Jugadores, entrenadores y profes muestran su ficha; los clubes encuentran refuerzos.">

<title>Fichaje Abierto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: banda azul noche estilo transmisión deportiva (marca + pestañas sesgadas), cinta de deportes que se despliega según las fichas, grilla de tarjetas tipo "ficha de partido". */
:root{
  --bg:#edf0f5; --surface:#ffffff; --surface-2:#f4f6fa; --ink:#0f1828; --muted:#5a6579; --line:#d5dbe5;
  --band:#0f1b30; --band-2:#182a4a; --on-band:#eef3fb; --on-band-dim:#a9b6cc;
  --accent:#f0590a; --accent-ink:#ffffff; --accent-soft:#fde6d8;
  --ok:#1a7f4b; --warn:#a96400; --bad:#c0352b; --star:#f0a30a;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:6px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1019; --surface:#111a29; --surface-2:#162236; --ink:#e6ecf5; --muted:#95a2b7; --line:#243248;
  --band:#070c15; --band-2:#111d33; --on-band:#eef3fb; --on-band-dim:#8d9bb3;
  --accent:#ff6a1c; --accent-ink:#ffffff; --accent-soft:#3a2216;
  --ok:#4cc184; --warn:#e3a93b; --bad:#ef7b6f; --star:#f5b632; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1019; --surface:#111a29; --surface-2:#162236; --ink:#e6ecf5; --muted:#95a2b7; --line:#243248;
  --band:#070c15; --band-2:#111d33; --on-band:#eef3fb; --on-band-dim:#8d9bb3;
  --accent:#ff6a1c; --accent-ink:#ffffff; --accent-soft:#3a2216;
  --ok:#4cc184; --warn:#e3a93b; --bad:#ef7b6f; --star:#f5b632; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.disp{font-family:var(--f-display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.lbl{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Avisos */
.testbar{background:var(--bad);color:#fff;font-size:14px}
.testbar .wrap,.demobar .wrap{padding-block:7px;display:flex;gap:8px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.demobar{background:var(--surface);border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.demobar b{color:var(--ink)}
.demo-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Banda */
.band{background:var(--band);color:var(--on-band);position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:0 0 0 auto;width:min(46%,520px);pointer-events:none;
  background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.045) 22px 44px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
.band .wrap{position:relative;z-index:1;padding-block:22px 0}
.brand{display:flex;align-items:flex-end;gap:8px 22px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:clamp(36px,6.4vw,60px);line-height:.88;text-transform:uppercase;letter-spacing:.005em;display:flex;align-items:center;gap:.18em}
.logo .slash{display:inline-block;width:.32em;height:.84em;background:var(--accent);transform:skewX(-14deg)}
.logo span{color:var(--accent)}
.brand p{margin:0;color:var(--on-band-dim);max-width:44ch;font-size:15px;padding-bottom:4px}
.tabs{display:flex;gap:6px;margin-top:22px}
.tab{appearance:none;border:0;cursor:pointer;background:transparent;color:var(--on-band-dim);padding:0;position:relative}
.tab span{display:block;padding:10px 20px 11px;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.tab::before{content:"";position:absolute;inset:0;transform:skewX(-14deg);border-radius:3px 3px 0 0;background:transparent;transition:background .15s}
.tab span{position:relative;white-space:nowrap}
@media (max-width:480px){.tab span{font-size:16px;padding:9px 14px 10px}.tabs{gap:2px}}
.tab:hover{color:var(--on-band)}
.tab:hover::before{background:var(--band-2)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::before{background:var(--bg)}

main .wrap{padding-block:22px 56px}

/* Cinta de deportes */
.sportbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.sportbar .lbl{margin-right:6px}
.sport{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;position:relative;color:var(--ink)}
.sport::before{content:"";position:absolute;inset:0;transform:skewX(-14deg);border:1px solid var(--line);background:var(--surface);border-radius:3px}
.sport span{position:relative;display:flex;gap:8px;align-items:baseline;padding:7px 16px;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.sport small{font-style:normal;font-weight:600;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sport[aria-pressed="true"]{color:var(--accent-ink)}
.sport[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent)}
.sport[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.sport.new span::after{content:"Nuevo";font-style:normal;font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.04em;background:var(--ink);color:var(--surface);padding:1px 6px;border-radius:3px;align-self:center}

/* Filtros */
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end;margin-bottom:16px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.filters .f-q{grid-column:span 2}
@media (max-width:520px){.filters .f-q{grid-column:1/-1}}
label.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=url],select,textarea{
  width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 11px}
.filters input,.filters select{background:var(--surface-2)}
textarea{resize:vertical;min-height:90px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.chk{display:flex;gap:8px;align-items:center;padding:9px 0;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent);flex:none}

.resbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.resbar .count{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}

/* Tarjetas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px}
.pcard{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s ease,box-shadow .15s ease}
.pcard:hover{transform:translateY(-3px);box-shadow:0 10px 24px -14px rgba(15,24,40,.45)}
.photo{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--band-2);overflow:hidden}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-weight:900;font-size:72px;color:rgba(238,243,251,.16)}
.photo .shade{position:absolute;inset:auto 0 0 0;height:58%;background:linear-gradient(0deg,rgba(7,12,21,.92),rgba(7,12,21,0))}
.photo .on{position:absolute;left:12px;right:12px;bottom:10px;color:#fff}
.photo .on .pname{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:25px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.photo .on .pmeta{color:rgba(255,255,255,.78);font-size:13px;margin-top:3px}
.dorsal{position:absolute;left:10px;top:4px;font-family:var(--f-display);font-style:italic;font-weight:900;font-size:56px;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.85)}
.pos{position:absolute;right:12px;top:12px;font-family:var(--f-display);font-weight:700;letter-spacing:.06em;font-size:14px;color:var(--accent-ink);padding:0}
.pos::before{content:"";position:absolute;inset:0;background:var(--accent);transform:skewX(-14deg);border-radius:2px}
.pos b{position:relative;display:block;padding:2px 10px;font-weight:700}
.pbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st-libre{color:var(--ok)} .st-abierto{color:var(--warn)} .st-prueba{color:var(--muted)}
.specs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:4px;margin-top:auto;overflow:hidden}
.specs div{padding:5px 8px;border-right:1px solid var(--line);background:var(--surface-2)}
.specs div:last-child{border-right:0}
.specs span{display:block;font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.specs b{font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.sporttag{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.empty{border:2px dashed var(--line);border-radius:var(--r);padding:36px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface)}
.empty h2{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:30px;text-transform:uppercase}
.empty p{margin:0;color:var(--muted);max-width:52ch}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:9px 16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:17px;padding:8px 20px}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}

/* Mi ficha */
.edit{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:28px;align-items:start}
.preview-col{position:sticky;top:16px;display:flex;flex-direction:column;gap:10px}
@media (max-width:900px){.edit{grid-template-columns:1fr;gap:16px}
  .edit>.preview-col{order:-1;position:static;display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;align-items:start}
  .preview-col>.lbl{grid-column:1/-1}.preview-col #full-prev{align-self:end;justify-self:start}
  .preview-col .photo .on .pname{font-size:18px}.preview-col .pbody{display:none}.preview-col .dorsal{font-size:36px}.preview-col .pos{font-size:12px;top:8px;right:8px}}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 20px;margin-bottom:16px}
.sec h2{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.02em;margin-bottom:2px}
.sec .hint{color:var(--muted);font-size:14px;margin:0 0 14px}
.sec.sportsec{border-color:var(--accent);background:linear-gradient(90deg,var(--accent-soft),var(--surface) 70%)}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:12px}
.row:last-child{margin-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:3px;padding:5px 12px;cursor:pointer;font-size:14px;user-select:none;background:var(--surface-2)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){background:var(--band-2);border-color:var(--band-2);color:var(--on-band)}
.chip:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.traj{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.trow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) 80px 80px minmax(0,2fr) auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2)}
@media (max-width:760px){.trow{grid-template-columns:1fr 1fr}.trow .t-club,.trow .t-logros{grid-column:1/-1}}
.media-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.thumb{width:110px;aspect-ratio:4/5;border-radius:4px;background:var(--band-2);overflow:hidden;display:grid;place-items:center;color:var(--on-band-dim);font-size:13px;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.vlist{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.vitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2)}
.vitem .vtag{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--line);padding:2px 6px;border-radius:3px}
.addv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.savebar{position:sticky;bottom:0;z-index:5;background:var(--bg);box-shadow:0 -6px 12px -8px rgba(0,0,0,.25);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.savebar .msg{font-size:14px;color:var(--muted);flex:1;min-width:160px}
.savebar .msg.ok{color:var(--ok)} .savebar .msg.bad{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.banner b{display:block;margin-bottom:4px}

/* Detalle */
dialog{border:0;padding:0;max-width:min(940px,calc(100vw - 24px));width:100%;max-height:calc(100dvh - 24px);border-radius:8px;background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(5,10,20,.7)}
.dhead{display:grid;grid-template-columns:270px minmax(0,1fr);background:var(--band);color:var(--on-band);position:relative;overflow:hidden}
.dhead::after{content:"";position:absolute;inset:0 0 0 auto;width:40%;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.04) 22px 44px)}
@media (max-width:640px){.dhead{grid-template-columns:1fr}.dhead .photo{aspect-ratio:auto;height:340px}}
.dhead .photo .shade,.dhead .photo .on,.dhead .photo .pos{display:none}
.dinfo{padding:22px 22px 20px;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative;z-index:1}
.dinfo .dname{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:clamp(32px,5vw,48px);line-height:.95;text-transform:uppercase}
.dinfo .apodo{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:19px;color:var(--accent);letter-spacing:.03em}
.dinfo .pmeta{color:var(--on-band-dim)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));margin-top:8px;border:1px solid rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
.kv div{padding:8px 12px;border-right:1px solid rgba(255,255,255,.12)}
.kv div:last-child{border-right:0}
.kv span{display:block;font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--on-band-dim)}
.kv b{font-family:var(--f-display);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums}
@media (max-width:520px){.kv{grid-template-columns:repeat(2,1fr)}.kv div{border-bottom:1px solid rgba(255,255,255,.12)}}
.closex{position:absolute;right:10px;top:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:20px;cursor:pointer;line-height:1}
.dbody{padding:20px 22px 26px;display:grid;gap:26px}
.dbody h3{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats div{padding:12px 14px;border-right:1px solid var(--line);background:var(--surface-2)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-family:var(--f-display);font-style:italic;font-weight:900;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.stats div:nth-child(2){border-right:0}.stats div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.timeline li:last-child{border-bottom:0}
.timeline .yrs{font-family:var(--f-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;color:var(--muted)}
.timeline .club{font-weight:700}
.timeline .cat{font-size:13px;color:var(--muted)}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.vid{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
.vid video{width:100%;display:block;background:#000;aspect-ratio:16/9;max-width:100%}
.vid .vt{padding:8px 12px;font-weight:600;font-size:14px}
.vlink{display:flex;gap:12px;align-items:center;padding:14px;text-decoration:none;color:inherit}
.vlink .play{width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none}
.vlink .play::after{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.vlink small{display:block;color:var(--muted);word-break:break-all}
.traits{display:flex;flex-wrap:wrap;gap:8px}
.traits span{background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:4px 12px;font-size:14px}
.bio{max-width:65ch;margin:0;white-space:pre-line}
.contact{display:flex;flex-direction:column;gap:8px}
.cline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:4px}
.cline .lbl{width:84px}
.cline code{font-family:var(--f-display);font-size:18px;font-weight:600;user-select:all;flex:1;min-width:0;word-break:break-all}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.loading{color:var(--muted);padding:20px 0}
.testbar{background:var(--bad);color:#fff;font-size:14px}
.testbar .wrap{padding-block:7px}
.acctbar{display:flex;gap:8px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;margin-bottom:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:14px}
.authwrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.authwrap .chiprow{margin-bottom:14px}
dialog:has(.gate){max-width:min(480px,calc(100vw - 24px))}
.gate{max-width:440px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.gate .gate-card{width:200px;max-width:100%;pointer-events:none}
.gate .gate-card .pcard{cursor:default}
.gate h2{margin-top:6px}
.gate .hint{margin:0}
.gate-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.morewrap{display:flex;justify-content:center;margin-top:18px}
.sitefoot{border-top:1px solid var(--line);margin-top:32px;color:var(--muted);font-size:14px}
.sitefoot .wrap{display:flex;gap:8px 18px;flex-wrap:wrap;justify-content:space-between;padding-block:18px}
.sitefoot a{color:inherit}
.legal{max-width:760px;margin:0 auto}
.legal h2{margin:24px 0 8px;font-size:20px}
.legal p,.legal li{line-height:1.55}
.legal ul{padding-left:20px}
.legal .upd{color:var(--muted);font-size:14px}
.chk.legalchk{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;font-size:14px;line-height:1.4}
.chk.legalchk input{margin-top:3px;flex:none}
.legalchk a,.legal a:not(.btn){color:var(--accent)}
.tutorbox{grid-column:1/-1;display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.4;padding:10px 12px;border:1px dashed var(--line);border-radius:4px}
.tutorbox input{margin-top:3px;flex:none}
input[type=password],input[type=month]{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 11px;color:var(--ink)}
/* Cuerpo técnico */
.specs.coach b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.licbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;overflow:hidden;background:var(--surface-2)}
.licbox div{padding:10px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.licbox span{display:block;font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.licbox b{font-weight:700}
.licbox b.okc{color:var(--ok)}
.logros{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.logros li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:baseline;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2)}
.logros .yr{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.lrow{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2)}
@media (max-width:520px){.lrow{grid-template-columns:80px minmax(0,1fr)}.lrow .btn{grid-column:1/-1;justify-self:start}}
.trow.coach{grid-template-columns:minmax(0,1.6fr) minmax(0,1.3fr) 76px 76px minmax(0,1.3fr) minmax(0,1.6fr) auto}
@media (max-width:760px){.trow.coach{grid-template-columns:1fr 1fr}}
/* Temporadas y valoración */
.seasons{display:flex;flex-direction:column;gap:10px}
.season{border:1px solid var(--line);border-radius:4px;padding:12px 14px;background:var(--surface-2)}
.season-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.season-head .yr{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:26px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.season-head .club{font-weight:700}
.season-head .cat{font-size:13px;color:var(--muted)}
.season p{margin:8px 0 0;white-space:pre-line;max-width:70ch}
.snums{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px}
.snums div{display:flex;flex-direction:column}
.snums b{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.snums span{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sverif{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}
.srow{padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2)}
.srow .row{margin-bottom:10px}
.valor{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.valor div{padding:12px 14px;border-right:1px solid var(--line);background:var(--surface-2)}
.valor div:last-child{border-right:0}
.valor b{display:block;font-family:var(--f-display);font-style:italic;font-weight:900;font-size:30px;line-height:1;color:var(--ink)}
.valor span{font-size:13px;color:var(--muted)}
/* Cuentas, novedades, clubes */
.brand{position:relative}
.bell{margin-left:auto;align-self:center;appearance:none;border:1px solid rgba(255,255,255,.22);background:var(--band-2);color:var(--on-band);border-radius:999px;padding:7px 14px;display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-weight:600;font-size:14px}
.bell:hover{border-color:var(--on-band)}
.bell .cnt{background:var(--accent);color:#fff;border-radius:999px;min-width:22px;padding:1px 7px;font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
.bell svg{width:18px;height:18px}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
@media (max-width:560px){.tab span{font-size:14px;padding:9px 9px 10px;letter-spacing:.02em}.tabs{gap:0}.chiprow{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-left:-4px;padding-left:4px}.chiprow .sport{flex:none}}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.feedwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:900px){.feedwrap{grid-template-columns:1fr}}
.feed{display:flex;flex-direction:column;gap:12px;min-width:0}
.post{appearance:none;text-align:left;width:100%;color:inherit;font:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;cursor:pointer}
.post:hover{border-color:var(--muted)}
.crest{width:52px;height:52px;border-radius:4px;background:var(--band-2);overflow:hidden;display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-weight:900;font-size:20px;color:var(--on-band-dim);flex:none}
.crest img{width:100%;height:100%;object-fit:cover}
.crest.big{width:96px;height:96px;font-size:36px}
.ptag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.ptag.prueba{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ptag.temporada{background:var(--band-2);border-color:var(--band-2);color:var(--on-band)}
.ptag.fichaje{background:var(--ok);border-color:var(--ok);color:#fff}
.post h3{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:22px;line-height:1.1;text-transform:uppercase;margin:6px 0 4px}
.post .who{font-size:14px;color:var(--muted)}
.post .who b{color:var(--ink)}
.post p{margin:6px 0 0;white-space:pre-line;max-width:70ch;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.post .facts{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:8px;font-size:14px}
.post .facts b{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:var(--muted);margin-right:4px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.side .sec{margin:0}
.clubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ccard{appearance:none;text-align:left;color:inherit;font:inherit;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;cursor:pointer}
.ccard:hover{border-color:var(--muted)}
.ccard .cn{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:20px;line-height:1.05;text-transform:uppercase}
.ccard .cm{font-size:13px;color:var(--muted)}
.chooser{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:720px}
.choice{appearance:none;text-align:left;color:inherit;font:inherit;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.choice:hover,.choice:focus-visible{border-color:var(--accent)}
.choice b{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:28px;text-transform:uppercase}
.choice span{color:var(--muted)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2)}
.mrow .mn{font-weight:700}
.mrow .ms{font-size:13px;color:var(--muted)}
.mrow .ms.ok{color:var(--ok);font-weight:600}
.mlist{display:flex;flex-direction:column;gap:8px}
.notif{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:start}
.notif:last-child{border-bottom:0}
.notif .crest{width:44px;height:44px;font-size:16px}
.notif.nuevo{background:var(--accent-soft);border-radius:4px;padding:12px 8px}
.notif .nt{font-size:14px}
.notif .nd{font-size:12px;color:var(--muted);margin-top:2px}
.npanel{padding:20px 22px 24px}
.npanel h2{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:28px;text-transform:uppercase;margin-bottom:6px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badges span{font-size:12px;font-weight:600;padding:2px 8px;border-radius:3px;background:rgba(255,255,255,.12);color:var(--on-band)}
.stars{color:var(--star);letter-spacing:1px;white-space:nowrap}
.stars i{font-style:normal;color:var(--line)}
.rating{display:flex;gap:6px;align-items:baseline;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rating .stars{font-size:15px}
.rating b{color:var(--ink);font-weight:700}
.refsum{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.refsum .big{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.refsum .stars{font-size:22px}
.reflist{display:flex;flex-direction:column;gap:12px}
.ref{border:1px solid var(--line);border-left:4px solid var(--star);border-radius:4px;padding:14px 16px;background:var(--surface-2)}
.ref-head{display:flex;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.ref-head .club{font-weight:700}
.ref p{margin:0;white-space:pre-line;max-width:65ch}
.ref .firma{font-size:13px;color:var(--muted);margin-top:8px}
.verif{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ok)}
.verif::before{content:"✓"}
.invlist{display:flex;flex-direction:column;gap:10px}
.inv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2)}
.inv .club{font-weight:700}
.inv .st{font-size:13px;color:var(--muted)}
.inv .linkbox{grid-column:1/-1;margin-top:0}
.starpick{display:flex;gap:4px;flex-direction:row-reverse;justify-content:flex-end}
.starpick input{position:absolute;opacity:0;pointer-events:none}
.starpick label{font-size:42px;line-height:1;color:var(--line);cursor:pointer;padding:0 2px}
.starpick input:checked~label,.starpick label:hover,.starpick label:hover~label{color:var(--star)}
.starpick input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.refform{max-width:640px;margin:0 auto}
.refplayer{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:center;margin-bottom:16px}
.refplayer .photo{border-radius:4px}
.refplayer .photo .ph{font-size:36px}
/* Novedades */
.news{margin-bottom:20px}
.news-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.news-head h2{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.news-head p{margin:0;color:var(--muted);font-size:14px}
.news-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.ncard{scroll-snap-align:start;appearance:none;text-align:left;border:0;background:var(--band);color:var(--on-band);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px;align-items:center;position:relative;overflow:hidden}
button.ncard{cursor:pointer}
.ncard::after{content:"";position:absolute;inset:0 0 0 auto;width:45%;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 14px,rgba(255,255,255,.05) 14px 28px)}
.ncard>*{position:relative;z-index:1;min-width:0}
.nph{width:60px;height:60px;border-radius:4px;background:var(--band-2);overflow:hidden;display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-weight:900;font-size:24px;color:var(--on-band-dim)}
.nph img{width:100%;height:100%;object-fit:cover}
.ndate{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.nname{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:20px;line-height:1.05;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nclub{font-size:14px;color:var(--on-band-dim)}
.nclub b{color:var(--on-band)}
.nconf{font-size:12px;font-weight:600;color:var(--on-band-dim);margin-top:2px}
.nconf.ok{color:#6fd39a}
.nconf.ok::before{content:"✓ "}
.st-fichado{color:var(--accent)}
.fbanner{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);border:1px solid var(--accent)}
.fbanner b{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:20px;text-transform:uppercase}
.vok{color:var(--ok);font-weight:600;font-size:14px}
.vpend{color:var(--muted);font-size:14px}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.linkbox code{font-family:var(--f-display);font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 8px;flex:1;min-width:0;word-break:break-all;user-select:all}
.radios{display:flex;flex-direction:column;gap:4px;margin:4px 0 12px}
.radios label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.radios input{margin-top:4px;accent-color:var(--accent)}
.confbox{max-width:620px;margin:0 auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>




<header class="band">
  <div class="wrap">
    <div class="brand">
      <div class="logo"><i class="slash" aria-hidden="true"></i>Fichaje <span>Abierto</span></div>
      <p>La vitrina del deporte. Los jugadores muestran su ficha, los clubes encuentran refuerzos.</p>
      <button type="button" class="bell" id="bell" hidden aria-label="Notificaciones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span>Avisos</span><span class="cnt" id="bell-cnt" hidden>0</span></button>
    </div>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button class="tab" role="tab" id="tab-inicio" data-view="inicio"><span>Inicio</span></button>
      <button class="tab" role="tab" id="tab-explorar" data-view="explorar"><span>Jugadores</span></button>
      <button class="tab" role="tab" id="tab-entrenadores" data-view="entrenadores"><span>Entrenadores</span></button>
      <button class="tab" role="tab" id="tab-profes" data-view="profes"><span>Profes</span></button>
      <button class="tab" role="tab" id="tab-clubes" data-view="clubes" hidden><span>Clubes</span></button>
      <button class="tab" role="tab" id="tab-mi-ficha" data-view="mi-ficha"><span>Mi cuenta</span></button>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <section id="view-inicio" aria-labelledby="tab-inicio" hidden>
      <div class="feedwrap">
        <div>
          <div class="chiprow" id="feedchips" role="group" aria-label="Tipo de novedad"></div>
          <div class="feed" id="feed"><p class="loading">Cargando novedades…</p></div>
        </div>
        <aside class="side" id="feedside"></aside>
      </div>
    </section>

    <section id="view-entrenadores" aria-labelledby="tab-entrenadores" hidden>
      <div class="filters">
        <label class="fld f-q"><span class="lbl">Buscar</span><input type="text" id="e-q" placeholder="Nombre, ciudad, club…"></label>
        <label class="fld" id="e-dep-wrap" hidden><span class="lbl">Deporte</span><select id="e-dep"></select></label>
        <label class="fld"><span class="lbl">Rol</span><select id="e-rol"></select></label>
        <label class="fld"><span class="lbl">Licencia</span><select id="e-lic"></select></label>
        <label class="fld"><span class="lbl">Habilitado para dirigir</span><select id="e-hab"></select></label>
        <label class="fld"><span class="lbl">País</span><select id="e-pais"></select></label>
        <label class="fld" id="e-prov-wrap"><span class="lbl">Provincia</span><select id="e-prov"></select></label>
        <label class="chk"><input type="checkbox" id="e-libres"> Solo libres</label>
        <label class="chk"><input type="checkbox" id="e-vig"> Carnet vigente</label>
      </div>
      <div class="resbar"><div class="count" id="ecount">Cargando entrenadores…</div></div>
      <div id="egrid"></div>
    </section>

    <section id="view-profes" aria-labelledby="tab-profes" hidden>
      <div class="filters">
        <label class="fld f-q"><span class="lbl">Buscar</span><input type="text" id="p-q" placeholder="Nombre, ciudad, club…"></label>
        <label class="fld" id="p-dep-wrap" hidden><span class="lbl">Deporte</span><select id="p-dep"></select></label>
        <label class="fld"><span class="lbl">Rol</span><select id="p-rol"></select></label>
        <label class="fld"><span class="lbl">Título</span><select id="p-tit"></select></label>
        <label class="fld"><span class="lbl">Especialidad</span><select id="p-esp"></select></label>
        <label class="fld"><span class="lbl">País</span><select id="p-pais"></select></label>
        <label class="fld" id="p-prov-wrap"><span class="lbl">Provincia</span><select id="p-prov"></select></label>
        <label class="chk"><input type="checkbox" id="p-libres"> Solo libres</label>
      </div>
      <div class="resbar"><div class="count" id="pcount">Cargando profes…</div></div>
      <div id="pgrid"></div>
    </section>

    <section id="view-clubes" aria-labelledby="tab-clubes" hidden>
      <div class="resbar"><div class="count" id="ccount">Cargando clubes…</div></div>
      <div id="clubgrid"></div>
    </section>

    <section id="view-explorar" aria-labelledby="tab-explorar" hidden>
      <section class="news" id="news" hidden aria-labelledby="news-title"></section>
      <div class="sportbar" id="sportbar" role="group" aria-label="Deporte"></div>
      <div class="filters">
        <label class="fld f-q"><span class="lbl">Buscar</span><input type="text" id="f-q" placeholder="Nombre, ciudad, club…"></label>
        <label class="fld"><span class="lbl">Posición</span><select id="f-pos"></select></label>
        <label class="fld"><span class="lbl">País</span><select id="f-pais"></select></label>
        <label class="fld" id="f-prov-wrap"><span class="lbl">Provincia</span><select id="f-prov"></select></label>
        <label class="fld"><span class="lbl" id="f-lado-lbl">Pie hábil</span><select id="f-lado"><option value="">Todos</option><option value="derecho">Derecho</option><option value="izquierdo">Izquierdo</option><option value="ambidiestro">Ambidiestro</option></select></label>
        <label class="fld"><span class="lbl">Valoración</span><select id="f-val"><option value="">Todas</option><option value="3">3 estrellas o más</option><option value="4">4 estrellas o más</option><option value="ref">Con referencias</option></select></label>
        <label class="chk"><input type="checkbox" id="f-libres"> Solo libres</label>

const COACH_TRAITS = ["Liderazgo","Gestión de grupo","Lectura de juego","Táctica","Pelota parada","Trabajo con juveniles","Formación de base","Planificación","Análisis de video","Entrenamiento de arqueros","Comunicación"];

const traitsFor = p => isProfe(p) ? PROFE_TRAITS : COACH_TRAITS;
const LIC = [["pro","Licencia CONMEBOL PRO"],["a","Licencia CONMEBOL A"],["b","Licencia CONMEBOL B"],["c","Licencia CONMEBOL C"],["dt","Título de Director Técnico (ATFA u otra escuela)"],["curso","En formación (cursando)"],["otro","Otro título o licencia"],["no","Sin título"]];

const HAB = [["primera","Primera División y Primera Nacional"],["ascenso","Ascenso y juveniles desde Sub-16"],["amateur","Fútbol amateur, ligas regionales y formativas hasta Sub-15"],["infantiles","Infantiles / escuelita (hasta 12 años)"],["no","No habilitado actualmente"]];

const vigenteOK = p => !!(p && p.carnetVigente) && (!p.vigencia || String(p.vigencia) >= today().slice(0,7));

const statLabels = p => { const s = SP(p); const l = s.stats.slice(); if (s.statsArq && p.posicion === s.arq) l[3] = s.statsArq; return l; };

/* ---------- países ---------- */
const PROV = ["Buenos Aires","CABA","Catamarca","Chaco","Chubut","Córdoba","Corrientes","Entre Ríos","Formosa","Jujuy","La Pampa","La Rioja","Mendoza","Misiones","Neuquén","Río Negro","Salta","San Juan","San Luis","Santa Cruz","Santa Fe","Santiago del Estero","Tierra del Fuego","Tucumán"];
const ISO = new Set("AF,AL,DE,AD,AO,AG,SA,DZ,AR,AM,AU,AT,AZ,BS,BD,BB,BH,BE,BZ,BJ,BY,BO,BA,BW,BR,BN,BG,BF,BI,BT,CV,KH,CM,CA,QA,TD,CL,CN,CY,CO,KM,CG,CD,KP,KR,CI,CR,HR,CU,DK,DM,EC,EG,SV,AE,ER,SK,SI,ES,US,EE,SZ,ET,PH,FI,FJ,FR,GA,GM,GE,GH,GD,GR,GT,GN,GQ,GW,GY,HT,HN,HK,HU,IN,ID,IQ,IR,IE,IS,MH,SB,IL,IT,JM,JP,JO,KZ,KE,KG,KI,XK,KW,LA,LS,LV,LB,LR,LY,LI,LT,LU,MO,MK,MG,MY,MW,MV,ML,MT,MA,MU,MR,MX,FM,MD,MC,MN,ME,MZ,MM,NA,NR,NP,NI,NE,NG,NO,NZ,OM,NL,PK,PW,PS,PA,PG,PY,PE,PL,PT,PR,GB,CF,CZ,DO,RW,RO,RU,WS,KN,SM,VC,LC,ST,SN,RS,SC,SL,SG,SY,SO,LK,ZA,SD,SS,SE,CH,SR,TH,TW,TZ,TJ,TL,TG,TO,TT,TN,TM,TR,TV,UA,UG,UY,UZ,VU,VA,VE,VN,YE,DJ,ZM,ZW".split(","));
const regionNames = (() => { try { return new Intl.DisplayNames(["es"], {type:"region"}); } catch { return null; } })();
const cName = c => { try { return (regionNames && regionNames.of(c)) || c; } catch { return c; } };
const COUNTRIES = [["AR", cName("AR")]].concat([...ISO].filter(c => c !== "AR").map(c => [c, cName(c)]).sort((a,b) => a[1].localeCompare(b[1], "es")));
const flag = c => ISO.has(c) ? String.fromCodePoint(...[...c].map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65)) : "";
const paisOf = p => ISO.has(p.pais) ? p.pais : (p.provincia === "Fuera de Argentina" ? "" : "AR");
const natName = v => ISO.has(v) ? cName(v) : String(v || "");
const natCode = v => { if (ISO.has(v)) return v; const t = String(v || "").trim().toLowerCase(); const hit = COUNTRIES.find(([,n]) => n.toLowerCase() === t); return hit ? hit[0] : ""; };
const placeOf = p => { const c = paisOf(p); const parts = [p.ciudad, p.provincia === "Fuera de Argentina" ? "" : p.provincia].filter(Boolean); if (c && c !== "AR") parts.push(cName(c)); return parts.length ? (c ? flag(c) + " " : "") + parts.join(", ") : ""; };

const DISP = {libre:"Libre ahora", abierto:"Con club · escucha ofertas", prueba:"Disponible para pruebas", fichado:"Fichado"};
const TIPOS = {fichaje:"Fichaje", prestamo:"Préstamo", prueba:"Quedó a prueba"};
const VERBO = {fichaje:"firmó con", prestamo:"llega a préstamo a", prueba:"quedó a prueba en"};
const hasFichaje = p => !!(p && p.fichaje && p.fichaje.club && p.fichaje.fecha);
const fmtD = d => { try { return new Date(String(d) + "T12:00:00").toLocaleDateString("es-AR", {day:"numeric", month:"short", year:"numeric"}); } catch { return String(d); } };
const today = () => { const n = new Date(); return new Date(n.getTime() - n.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const hex = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2,"0")).join("");
const baseUrl = () => location.href.split("#")[0];
const MAX_VIDEOS = 6;

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => { try { const x = new URL(String(u)); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } };
const assetId = v => (typeof v === "string" && /^[0-9a-f-]{36}\/[A-Za-z0-9._-]{1,60}$/.test(v)) ? v : "";
const num = v => { if (v === "" || v == null) return null; const n = Number(v); return Number.isFinite(n) && n >= 0 ? n : null; };
const age = d => { if (!d) return null; const b = new Date(d); if (isNaN(b)) return null; const n = new Date(); let a = n.getFullYear()-b.getFullYear(); const m = n.getMonth()-b.getMonth(); if (m<0 || (m===0 && n.getDate()<b.getDate())) a--; return a>=0 && a<90 ? a : null; };
const initials = n => String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase() || "?";
const countryOpts = (val, ph) => `<option value="">${ph}</option>` + COUNTRIES.map(([k,v]) => `<option value="${k}"${k===val?" selected":""}>${esc(v)}</option>`).join("");
const opts = (pairs, val, ph) => `<option value="">${ph}</option>` + pairs.map(([k,v]) => `<option value="${esc(k)}"${k===val?" selected":""}>${esc(v)}</option>`).join("");

/* ---------- datos compartidos ---------- */
const ART_URL = location.origin + location.pathname;
const blobSrc = id => assetId(id) ? SBU + "/storage/v1/object/public/fotos/" + id : "";
const hashCache = new Map();
async function sha(t){ if (hashCache.has(t)) return hashCache.get(t); const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); const h = Array.from(new Uint8Array(b), x => x.toString(16).padStart(2,"0")).join(""); hashCache.set(t, h); return h; }
const starsHTML = n => { const r = Math.round(n); return `<span class="stars" aria-label="${n.toFixed(1)} de 5 estrellas">${"★".repeat(r)}<i>${"★".repeat(5-r)}</i></span>`; };
const fmtMonth = t => { try { return new Date(t).toLocaleDateString("es-AR", {month:"long", year:"numeric"}); } catch { return ""; } };
let ME = null;
const S = { players:[], loaded:false, ready:false, myDoc:null, mineLoaded:false, draft:null, dirty:false, sport:"futbol", db:null, user:null, assets:null, canWrite:null,
  reviewDocs:[], reviewsLoaded:false, refs:new Map(), usedByHash:new Map(), confByHash:new Map(), priv:{tokens:{}, fichaje:""}, refFormOpen:false, confFormOpen:false };
try { const s = localStorage.getItem("fa_sport"); if (SPORTS[s]) S.sport = s; } catch {}
function ratingOfClaude(pid){ const rs = S.refs.get(pid) || []; if (!rs.length) return null; return { avg: rs.reduce((a,r)=>a+r.estrellas,0)/rs.length, n: rs.length }; }
const confOf = p => hasFichaje(p) && typeof p.fichaje.h === "string" ? (S.confByHash.get(p.fichaje.h) || null) : null;
const isConf = p => !!confOf(p);
async function savePrivClaude(patch){ const next = Object.assign({}, S.priv, patch); await S.db.doc("data/users/" + ME + "/invites").set(next); S.priv = next; }
function upErr(e){
  const c = e && e.code;
  return c === "too_large" ? "El archivo es demasiado grande (máximo 20 MB)."
    : c === "unsupported_type" ? "Ese formato no se puede subir. Usá JPG o PNG para fotos y MP4 o WebM para videos."
    : c === "quota_or_state" ? "Se llenó el espacio de la página. Probá con un link en lugar de un archivo."
    : c === "rate_limited" ? "Demasiados intentos seguidos. Esperá un minuto y volvé a probar."
    : "No se pudo subir el archivo. Volvé a intentarlo.";
}

/* ---------- referencias y confirmaciones (se validan con el link secreto) ---------- */
async function rebuildClaude(){
  const invByHash = new Map(), fichByHash = new Map();
  for (const p of S.players){
    for (const i of (Array.isArray(p.inv) ? p.inv : [])) if (i && typeof i.h === "string") invByHash.set(i.h, {player: p._id, club: String(i.club||""), por: typeof i.por === "string" ? i.por : ""});
    if (hasFichaje(p) && typeof p.fichaje.h === "string") fichByHash.set(p.fichaje.h, p._id);
  }
  const refEntries = [], confEntries = [];
  for (const d of S.reviewDocs){
    for (const [key, list] of [["given", refEntries], ["confirma", confEntries]]){
      const g = d[key]; if (!g || typeof g !== "object") continue;
      for (const [tok, r] of Object.entries(g)) if (/^[a-f0-9]{32}$/.test(tok) && r && typeof r === "object") list.push({tok, r, by: d.id});
    }
  }
  refEntries.sort((a,b) => (+a.r.fecha||0) - (+b.r.fecha||0));
  confEntries.sort((a,b) => (+a.r.fecha||0) - (+b.r.fecha||0));
  const refs = new Map(), used = new Map(), conf = new Map();
  for (const e of refEntries){
    const h = await sha(e.tok), inv = invByHash.get(h);
    if (!inv || e.by === inv.player || used.has(h)) continue;
    if (inv.por && inv.por !== e.by) continue;
    const st = Math.round(+e.r.estrellas); if (!(st >= 1 && st <= 5)) continue;
    used.set(h, e.by);
    const arr = refs.get(inv.player) || [];
    arr.push({club: inv.club, estrellas: st, texto: String(e.r.texto||"").slice(0,1000), firma: String(e.r.firma||"").slice(0,80), fecha: +e.r.fecha || 0});
    refs.set(inv.player, arr);
  }
  for (const e of confEntries){
    const h = await sha(e.tok), pid = fichByHash.get(h);
    if (!pid || e.by === pid || conf.has(h)) continue;
    conf.set(h, {quien: String(e.r.quien||"").slice(0,80), fecha: +e.r.fecha || 0, by: e.by});
  }
  S.refs = refs; S.usedByHash = used; S.confByHash = conf;
  if (ME && S.myDoc && Array.isArray(S.myDoc.inv) && S.canWrite !== false){
    let changed = false;
    const inv = S.myDoc.inv.map(i => (!i.por && used.has(i.h)) ? (changed = true, Object.assign({}, i, {por: used.get(i.h)})) : i);
    if (changed){ S.myDoc.inv = inv; S.db.doc("players/" + ME).update({inv}).catch(()=>{}); }
  }
  refreshAll();
  if (/^#ref-/.test(location.hash) && !S.refFormOpen) renderRef();
  if (/^#confirmar-/.test(location.hash) && !S.confFormOpen) renderConfirm();
}
let rebuildTimer = null;
const scheduleRebuild = () => { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(rebuild, 60); };
function refreshMineParts(){
  if (location.hash !== "#mi-ficha") return;
  if (S.myClub && $("#club-admin")){ refreshClubParts(); return; }
  if ($("#misclubes")) $("#misclubes").innerHTML = misClubesHTML();
  if ($("#invbox")) $("#invbox").innerHTML = invHTML();
  const fs = $("#fich-sec"); if (fs && !(fs.querySelector("#fich-form") && !fs.querySelector("#fich-form").hidden)) fs.outerHTML = fichajeSecHTML();
}

function refsHTML(pid){
  const rs = pid ? (S.refs.get(pid) || []) : [];
  if (!rs.length) return `<div><h3>Referencias de clubes</h3><p class="note" style="margin:0">Todavía no tiene referencias. Solo pueden dejarlas los clubes de su trayectoria, con un link personal.</p></div>`;
  const avg = rs.reduce((a,r)=>a+r.estrellas,0)/rs.length;
  const list = rs.slice().sort((a,b)=>b.fecha-a.fecha);
  return `<div><h3>Referencias de clubes</h3>
    <div class="refsum"><span class="big">${avg.toFixed(1)}</span>${starsHTML(avg)}<span class="note" style="margin:0">${rs.length} referencia${rs.length===1?"":"s"}</span></div>
    <div class="reflist">${list.map(r => `<div class="ref"><div class="ref-head"><span class="club">${esc(r.club)}</span>${starsHTML(r.estrellas)}</div>
      <p>${esc(r.texto)}</p>
      <div class="firma">${r.firma ? esc(r.firma) + " · " : ""}${esc(fmtMonth(r.fecha))} · <span class="verif">Club de su trayectoria</span></div></div>`).join("")}</div></div>`;
}

function invHTML(){
  if (!S.myDoc) return `<p class="note" style="margin:0">Primero publicá tu ficha con tu trayectoria. Después vas a poder pedir referencias a cada club.</p>`;
  const clubs = [...new Set((S.myDoc.trayectoria || []).map(t => String(t.club||"").trim()).filter(Boolean))];
  if (!clubs.length) return `<p class="note" style="margin:0">Agregá al menos un club en tu trayectoria y guardá la ficha.</p>`;
  const inv = Array.isArray(S.myDoc.inv) ? S.myDoc.inv : [];
  const mine = S.refs.get(ME) || [];
  return `<div class="invlist">${clubs.map((c, i) => {
    const entry = inv.find(x => x.club === c), tok = S.priv.tokens[c];
    const used = entry && (entry.por || S.usedByHash.has(entry.h));
    const got = mine.find(r => r.club === c);
    let st, right = "", box = "";
    if (used) st = got ? `Referencia recibida ${starsHTML(got.estrellas)}` : "Referencia recibida";
    else if (entry && tok){ st = "Link listo, esperando la referencia del club"; box = `<div class="linkbox"><code id="inv-link-${i}">${esc(ART_URL + "#ref-" + tok)}</code><button type="button" class="btn sm" data-copy-inv="${i}">Copiar link</button></div>`; }
    else if (entry) st = "Link generado en otro dispositivo";
    else { st = "Sin pedir"; right = `<button type="button" class="btn sm" data-ask="${esc(c)}">Pedir referencia</button>`; }
    return `<div class="inv"><div><div class="club">${esc(c)}</div><div class="st">${st}</div></div>${right}${box}</div>`;
  }).join("")}</div><p class="note">El club necesita una cuenta gratis de Fichaje Abierto (con el correo validado) para dejar la referencia.</p>`;
}
async function askRef(club){
  if (!S.myDoc || S.priv.tokens[club]) return;
  try {
    const tok = hex(), h = await sha(tok);
    await savePriv({tokens: Object.assign({}, S.priv.tokens, {[club]: tok}), fichaje: S.priv.fichaje});
    const inv = (Array.isArray(S.myDoc.inv) ? S.myDoc.inv : []).concat([{h, club, creado: Date.now()}]);
    await S.db.doc("players/" + ME).update({inv});
    S.myDoc.inv = inv;
    $("#invbox").innerHTML = invHTML();
  } catch { $("#invbox").insertAdjacentHTML("beforeend", `<p class="note" style="color:var(--bad)">No se pudo generar el link. Volvé a intentar.</p>`); }
}

async function renderRef(){

/* ---------- rutas ---------- */
function routeBase(){
  const h = location.hash;
  const v = h === "#mi-ficha" ? "mi-ficha" : h === "#explorar" ? "explorar" : h === "#entrenadores" ? "entrenadores" : h === "#profes" ? "profes" : h === "#clubes" && MOSTRAR_CLUBES ? "clubes" : /^#confirmar-[a-f0-9]{32}$/.test(h) ? "confirmar" : /^#ref-[a-f0-9]{32}$/.test(h) ? "ref" : "inicio";
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.view === v));
  $("#view-explorar").hidden = v !== "explorar";
  $("#view-inicio").hidden = v !== "inicio";
  $("#view-clubes").hidden = v !== "clubes";
  $("#view-entrenadores").hidden = v !== "entrenadores";
  $("#view-profes").hidden = v !== "profes";
  $("#view-mi-ficha").hidden = v !== "mi-ficha";
  $("#view-confirmar").hidden = v !== "confirmar";
  $("#view-ref").hidden = v !== "ref";
  if (v === "mi-ficha") renderMine();
  else if (v === "confirmar"){ S.confFormOpen = false; renderConfirm(); }
  else if (v === "ref"){ S.refFormOpen = false; renderRef(); }
  else if (v === "inicio") renderFeed();
  else if (v === "clubes") renderClubs();
  else if (v === "entrenadores") renderCoaches();
  else if (v === "profes") renderProfes();
  else { syncSportFilters(); renderGrid(); }
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { location.hash = t.dataset.view; }));
addEventListener("hashchange", route);

function renderGrid(){
  const grid = $("#grid"), count = $("#count");
  if (S.ready && !S.db){ count.textContent = ""; $("#news").hidden = true; grid.innerHTML = `<div class="empty"><h2>Fichas no disponibles</h2><p>Para ver las fichas tenés que abrir esta página con tu cuenta iniciada.</p></div>`; return; }
  if (!S.loaded){ count.textContent = "Cargando fichas…"; return; }
  renderSportBar(); renderNews();
  const val = $("#f-val").value, q = $("#f-q").value.trim().toLowerCase(), pos = $("#f-pos").value, pais = $("#f-pais").value, prov = $("#f-prov").value, lado = $("#f-lado").value, libres = $("#f-libres").checked, ue = $("#f-ue").checked;
  const all = published().filter(p => sportOf(p) === S.sport);
  const list = all.filter(p =>
    (!pos || p.posicion === pos || (Array.isArray(p.posSec) && p.posSec.includes(pos))) &&
    (!pais || paisOf(p) === pais) && (!prov || p.provincia === prov) && (!lado || p.lado === lado) &&
    (!libres || p.disponibilidad === "libre") && (!ue || p.pasaporteUE === true) &&
    (!val || (() => { const r = ratingOf(p._id); return val === "ref" ? !!r : (r && r.avg >= +val); })()) &&
    (!q || [p.nombre,p.apodo,p.ciudad,p.provincia,p.clubActual,cName(paisOf(p)||"")].join(" ").toLowerCase().includes(q)));
  const sn = SPORTS[S.sport].nombre;
  if (!all.length){
    count.textContent = `${sn} · 0 jugadores`;
    grid.innerHTML = `<div class="empty"><h2>Todavía no hay fichas de ${esc(sn.toLowerCase())}</h2><p>Acá van a aparecer los jugadores con su foto, posición, trayectoria y videos. Si jugás, cargá tu ficha y sé el primero que ven los clubes.</p><a class="btn primary" href="#mi-ficha">Cargar mi ficha</a></div>`;
    return;
  }
  count.textContent = `${sn} · ${list.length} de ${all.length} jugador${all.length===1?"":"es"}`;
  grid.innerHTML = list.length ? `<div class="grid">${pageOf(grid.id, list).map(p=>cardHTML(p)).join("")}</div>${moreBtn(grid.id, list)}`
    : `<div class="empty"><h2>Sin resultados</h2><p>Ningún jugador coincide con esos filtros. Probá ampliar la posición o el país.</p></div>`;
}

  if (!ME){ box.innerHTML = loginNeededHTML("Ingresá para confirmar el fichaje", "Para confirmar necesitás una cuenta gratis de Fichaje Abierto con el correo validado."); return; }
  const h = await sha(tok);
  const p = S.players.find(x => hasFichaje(x) && x.fichaje.h === h);

async function shrinkImage(file){
  try {
    const bmp = await createImageBitmap(file);
    const max = 1000, s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    const g2 = c.getContext("2d"); g2.fillStyle = "#fff"; g2.fillRect(0, 0, c.width, c.height); g2.drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.8));
  } catch { return file; }
}
async function uploadPhoto(file){
  const m = $("#foto-msg"); m.textContent = "Subiendo foto…";
  try {
    const blob = await shrinkImage(file);
    const r = await S.assets.upload(blob, {type: /^image\/(png|jpeg|gif|webp)$/.test(blob.type) ? blob.type : "image/jpeg"});
    S.draft.foto = r.id; $("#thumb").innerHTML = `<img src="${esc(r.url)}" alt="Tu foto">`; m.textContent = "Foto lista. Guardá para publicarla.";
    if (!$("#rm-foto")) m.insertAdjacentHTML("beforebegin", `<button type="button" class="btn sm danger" id="rm-foto">Quitar foto</button>`);
    touch();
  } catch(e){ m.textContent = upErr(e); }
}
async function uploadVideo(file){
  const m = $("#v-msg");
  const type = /webm$/i.test(file.name) || file.type === "video/webm" ? "video/webm" : (/mp4$/i.test(file.name) || file.type === "video/mp4" ? "video/mp4" : "");
  if (!type){ m.textContent = "Usá un archivo MP4 o WebM. Los videos .MOV del iPhone conviene subirlos a YouTube y pegar el link."; return; }
  if (file.size > 20*1024*1024){ m.textContent = `El clip pesa ${(file.size/1048576).toFixed(1)} MB y el máximo es 20 MB. Recortalo o subilo a YouTube y pegá el link.`; return; }
  m.textContent = "Subiendo clip…";
  try {
    const r = await S.assets.upload(file, {type});
    S.draft.videos.push({tipo:"archivo", id:r.id, titulo: file.name.replace(/\.[^.]+$/,"").slice(0,60)});
    refreshVideos(); touch();
  } catch(e){ m.textContent = upErr(e); }
}

function notifs(){
  const out = [], visto = +S.priv.visto || 0;
  if (S.myDoc){
    for (const c of myInvites()) out.push({kind:"invite", c, t: +((plantelOf(c).find(x => x.p === ME) || {}).desde) || 0, nuevo: true});
    for (const c of myClubsList()) for (const po of postsOf(c)) out.push({kind:"post", c, po, t: +po.creado || 0, nuevo: (+po.creado || 0) > visto});
  }
  if (S.myDoc && isCoach(S.myDoc)) for (const o of (S.opins.get(ME) || [])) out.push({kind:"opinion", o, t: o.fecha, nuevo: o.fecha > visto});
  if (S.myClub){
    const seen = S.priv.miembrosVistos || [];
    for (const x of plantelOf(S.myClub)){
      const p = playerById(x.p);
      if (p && (p.clubes || []).includes(ME)) out.push({kind:"joined", p, t: +x.desde || 0, nuevo: !seen.includes(p._id)});
      if (p && (p.rechazados || []).includes(ME)) out.push({kind:"rejected", p, t: +x.desde || 0, nuevo: !seen.includes("x" + p._id)});
    }
  }
  return out.sort((a,b) => b.t - a.t).slice(0, 40);
}

async function setMembership(patch){
  try {
    await S.db.doc("players/" + ME).update(patch);
    Object.assign(S.myDoc, patch);
    if (patch.temporadas && S.draft){ S.draft.temporadas = JSON.parse(JSON.stringify(patch.temporadas)); if ($("#season-sec")) $("#season-sec").outerHTML = seasonsSecHTML(); }
    $("#misclubes").innerHTML = misClubesHTML(); updateBell();

}

});

function refreshClubParts(){

const blankSeason = (D, anio, club) => ({anio: anio || String(new Date().getFullYear()), club: club != null ? club : (D.clubActual || ""), categoria:"", rol: D.posicion || "", s1:"", s2:"", s3:"", s4:"", resultado:"", comentario:""});
function seasonsOf(p){
  let t = Array.isArray(p.temporadas) ? p.temporadas.filter(x => x && (String(x.club||"").trim() || String(x.anio||"").trim())) : null;
  if (!t){
    t = [];
    const st = p.stats || {};
    if (["partidos","goles","asistencias","vallas"].some(k => st[k] !== "" && st[k] != null)) t.push({anio: p.temporada || "", club: p.clubActual || "", categoria:"", rol: p.posicion || "", s1: st.partidos, s2: st.goles, s3: st.asistencias, s4: st.vallas, resultado:"", comentario:""});
  }
  return t.slice().sort((a,b) => String(b.anio).localeCompare(String(a.anio)));
}
function withSeason(doc, club, anio){
  const ts = Array.isArray(doc.temporadas) ? doc.temporadas.slice() : seasonsOf(doc);
  if (club && !ts.some(t => String(t.anio) === String(anio) && norm(t.club) === norm(club))) ts.unshift(blankSeason(doc, anio, club));
  return ts;
}
function seasonVerified(p, t){
  const out = [];
  if (hasFichaje(p) && isConf(p) && norm(p.fichaje.club) === norm(t.club)) out.push("Fichaje confirmado por el club");
  if (S.clubs.some(c => norm(c.nombre) === norm(t.club) && plantelOf(c).some(x => x.p === p._id) && ((p.clubes||[]).includes(c._id) || (p.exclubes||[]).includes(c._id)))) out.push("Plantel confirmado en la app");
  return out;
}

function clean(D){

/* ----- opiniones de jugadores sobre DT y profes (solo compañeros de plantel en la app) ----- */
S.opins = new Map();
function sharedClub(a, b){
  if (!a || !b) return null;
  const inA = (a.clubes || []).concat(a.exclubes || []), inB = (b.clubes || []).concat(b.exclubes || []);
  return S.clubs.find(c => { const pl = plantelOf(c).map(x => x.p); return pl.includes(a._id) && pl.includes(b._id) && inA.includes(c._id) && inB.includes(c._id); }) || null;
}
function rebuildOpinsClaude(){
  const m = new Map();
  for (const d of S.reviewDocs){
    const o = d.opina; if (!o || typeof o !== "object") continue;
    const author = playerById(d.id); if (!author || isCoach(author)) continue;
    for (const [sid, r] of Object.entries(o)){
      const staff = playerById(sid); if (!staff || !isCoach(staff) || !r || typeof r !== "object") continue;
      const st = Math.round(+r.estrellas); if (!(st >= 1 && st <= 5)) continue;
      const c = sharedClub(author, staff); if (!c) continue;
      const arr = m.get(sid) || [];
      arr.push({by: d.id, nombre: author.nombre, estrellas: st, texto: String(r.texto || "").slice(0,600), fecha: +r.fecha || 0, club: c.nombre});
      m.set(sid, arr);
    }
  }
  S.opins = m;
}
function opinionStatsClaude(id){ const os = S.opins.get(id) || []; if (!os.length) return null; return {avg: os.reduce((a,o) => a + o.estrellas, 0) / os.length, n: os.length}; }

const jwtUser = tok => { try { const p = JSON.parse(atob(tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); return {id: p.sub, email: p.email}; } catch { return null; } };
function loadSession(){ try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch { session = null; } }
function saveSession(s){ session = s; try { s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); } catch {} }
function sessFromToken(t){
  const exp = +t.expires_at || (Math.floor(Date.now() / 1000) + (+t.expires_in || 3600));
  const u = t.user ? {id: t.user.id, email: t.user.email} : jwtUser(t.access_token);
  return {access_token: t.access_token, refresh_token: t.refresh_token, expires_at: exp, user: u};
}
async function authFetch(path, body, method = "POST", useUser = false){
  const h = {"apikey": SBK, "content-type": "application/json"};
  if (useUser && session) h.authorization = "Bearer " + session.access_token;
  const r = await fetch(SBU + "/auth/v1" + path, {method, headers: h, body: body ? JSON.stringify(body) : undefined});
  let j = null; try { j = await r.json(); } catch {}
  if (!r.ok) throw {status: r.status, code: j && (j.error_code || j.code || j.error), message: j && (j.msg || j.message || j.error_description || j.error) || ("Error " + r.status)};
  return j;
}
let refreshing = null;
async function refreshIfNeeded(){
  if (!session || !session.refresh_token) return;
  if (session.expires_at - 60 > Date.now() / 1000) return;
  if (!refreshing) refreshing = authFetch("/token?grant_type=refresh_token", {refresh_token: session.refresh_token})
    .then(t => saveSession(sessFromToken(t)))
    .catch(e => { if (e && e.status && e.status < 500){ saveSession(null); ME = null; } })
    .finally(() => { refreshing = null; });
  await refreshing;
}
async function api(path, {method = "GET", body, prefer} = {}){
  await refreshIfNeeded();
  const h = {"apikey": SBK};
  if (session) h.authorization = "Bearer " + session.access_token;
  if (body !== undefined) h["content-type"] = "application/json";
  if (prefer) h.prefer = prefer;
  const r = await fetch(SBU + "/rest/v1/" + path, {method, headers: h, body: body !== undefined ? JSON.stringify(body) : undefined});
  if (!r.ok){
    let j = null; try { j = await r.json(); } catch {}
    const msg = (j && (j.message || j.hint)) || ("Error " + r.status);
    throw {status: r.status, code: j && j.code, message: msg, userMsg: j && j.code === "P0001" ? msg : undefined};
  }
  if (r.status === 204) return null;
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
const eq = v => "eq." + encodeURIComponent(v);

/* ---------- carga de datos ----------
   Liviana: la lista trae solo las tarjetas (vista "tarjetas"), los clubes (vista "clubes_pub")
   y las últimas publicaciones. La ficha completa se pide recién al abrirla (hydrate).

const PAGE = 24;
const C = {lite: [], clubsPub: [], full: new Map(), clubFull: new Map(), pubs: new Map(), pl: new Map(), ops: new Map(), refs: new Map(), fich: new Map(), ped: [], priv: null, cuenta: null};
S.more = {}; S.byId = new Map();
const plKey = r => r.club_id + "|" + r.jugador_id, opKey = r => r.autor_id + "|" + r.staff_id;
function setScope(map, keyFn, test, rows){ for (const [k, v] of map) if (test(v)) map.delete(k); for (const r of rows || []) map.set(keyFn(r), r); }
const sumOf = (n, avg) => n > 0 && avg != null ? {avg: +avg, n: +n} : null;

function playerFrom(id, datos, cols, extra){
  const p = Object.assign({}, datos || {}, {
    _id: id, perfil: cols.perfil || "jugador", deporte: cols.deporte || "futbol", publicado: cols.publicado !== false,
    licencia: cols.licencia || "", habilitado: cols.habilitado || "", carnetVigente: !!cols.carnet_vigente,
    vigencia: cols.carnet_vence ? String(cols.carnet_vence).slice(0, 7) : "", actualizado: ms(cols.actualizado)
  }, extra || {});
  if (!p.lado && p.pie) p.lado = p.pie;
  return p;
}
const fichFromRow = f => f ? {club: f.club, fecha: f.fecha, tipo: f.tipo, h: f.token_hash, anunciado: ms(f.anunciado), conf: f.confirmado_por || "", conf_en: f.confirmado_en, conf_by: f.confirmado_autor} : null;
const seasonFromRow = t => ({anio: t.anio, club: t.club, categoria: t.categoria || "", rol: t.rol || "", s1: t.s1 ?? "", s2: t.s2 ?? "", s3: t.s3 ?? "", s4: t.s4 ?? "", resultado: t.resultado || "", comentario: t.comentario || ""});

/* arma S.players, S.clubs, S.refs, S.opins… a partir de lo que ya se trajo */
function assemble(){
  const pls = [...C.pl.values()], byJ = new Map(), byC = new Map();
  for (const r of pls){ (byJ.get(r.jugador_id) || byJ.set(r.jugador_id, []).get(r.jugador_id)).push(r); (byC.get(r.club_id) || byC.set(r.club_id, []).get(r.club_id)).push(r); }
  const memb = id => { const rows = byJ.get(id) || []; return {
    clubes: rows.filter(x => x.estado === "aceptado").map(x => x.club_id),
    exclubes: rows.filter(x => x.estado === "ex").map(x => x.club_id),
    rechazados: rows.filter(x => x.estado === "rechazado").map(x => x.club_id)}; };
  const players = [], seen = new Set();
  for (const t of C.lite){
    const F = C.full.get(t.id);
    const fich = F ? fichFromRow(F.fich) : (t.fichaje ? {club: t.fichaje.club, fecha: t.fichaje.fecha, tipo: t.fichaje.tipo, h: t.fichaje.h, anunciado: ms(t.fichaje.anunciado), conf: t.fichaje.conf || "", conf_en: t.fichaje.conf_en, conf_by: t.fichaje.conf_by} : null);
    const extra = Object.assign(memb(t.id), {
      _lite: !F, _tempN: t.temp_n || 0,
      _sum: {ref: sumOf(t.ref_n, t.ref_avg), op: sumOf(t.op_n, t.op_avg)}
    });
    if (F) extra.temporadas = F.temps.map(seasonFromRow).sort((a, b) => String(b.anio).localeCompare(String(a.anio)));
    const p = playerFrom(t.id, F ? F.row.datos : t.datos, F ? F.row : Object.assign({publicado: true}, t), extra);
    if (fich) p.fichaje = fich;
    players.push(p); seen.add(t.id);
  }
  for (const [id, F] of C.full){            // fichas propias ocultas (no están en las tarjetas)
    if (seen.has(id)) continue;
    const p = playerFrom(id, F.row.datos, F.row, Object.assign(memb(id), {_lite: false, _tempN: F.temps.length, _sum: {ref: null, op: null},
      temporadas: F.temps.map(seasonFromRow).sort((a, b) => String(b.anio).localeCompare(String(a.anio)))}));
    const fi = fichFromRow(F.fich); if (fi) p.fichaje = fi;
    players.push(p);
  }
  S.players = players;
  S.byId = new Map(players.map(p => [p._id, p]));
  const pubsBy = new Map(); for (const x of C.pubs.values()) (pubsBy.get(x.club_id) || pubsBy.set(x.club_id, []).get(x.club_id)).push(x);
  const clubs = [], cseen = new Set();
  const clubObj = (id, nombre, deporte, datos, actualizado, lite, nPl, nPosts) => Object.assign({}, datos || {}, {
    _id: id, nombre, deporte: deporte || "futbol", actualizado: ms(actualizado), _lite: lite, _nPl: nPl, _nPosts: nPosts,
    posts: (pubsBy.get(id) || []).map(x => ({id: x.id, tipo: x.tipo, titulo: x.titulo, texto: x.texto, fechaEvento: x.fecha_evento || "", hora: x.hora || "", lugar: x.lugar || "", creado: ms(x.creado)})),
    plantel: (byC.get(id) || []).map(x => ({p: x.jugador_id, desde: ms(x.desde)}))
  });
  for (const c of C.clubsPub){
    const F = C.clubFull.get(c.id);
    clubs.push(F ? clubObj(c.id, F.row.nombre, F.row.deporte, F.row.datos, F.row.actualizado, false, c.n_plantel, c.n_posts)
                 : clubObj(c.id, c.nombre, c.deporte, c.datos, c.actualizado, true, c.n_plantel, c.n_posts));
    cseen.add(c.id);
  }
  for (const [id, F] of C.clubFull) if (!cseen.has(id) && F.row.nombre && F.row.nombre.trim()) clubs.push(clubObj(id, F.row.nombre, F.row.deporte, F.row.datos, F.row.actualizado, false, 0, 0));
  S.clubs = clubs;
  S.refs = new Map([...C.refs].map(([id, rows]) => [id, rows.map(r => ({club: r.club, estrellas: r.estrellas, texto: r.texto, firma: r.firma, fecha: ms(r.creado)}))]));
  S.confByHash = new Map(players.filter(p => p.fichaje && p.fichaje.conf).map(p => [p.fichaje.h, {quien: p.fichaje.conf, fecha: ms(p.fichaje.conf_en), by: p.fichaje.conf_by}]));
  const clubName = id => (S.clubs.find(c => c._id === id) || {}).nombre || "su club";
  const opMap = new Map(), ops = [...C.ops.values()];
  for (const o of ops){ if (!C.full.has(o.staff_id) && o.staff_id !== ME) continue; const a = opMap.get(o.staff_id) || []; a.push({by: o.autor_id, nombre: (playerById(o.autor_id) || {}).nombre || "Un jugador", estrellas: o.estrellas, texto: o.texto, fecha: ms(o.creado), club: clubName(o.club_id)}); opMap.set(o.staff_id, a); }
  S.opins = opMap;
  RAW.fich = new Map(players.filter(p => p.fichaje).map(p => [p._id, {token_hash: p.fichaje.h}]));
  RAW.pubs = [...C.pubs.values()]; RAW.plantel = pls; RAW.pedidos = C.ped; RAW.ops = ops;
  const myOps = {}; for (const o of ops) if (o.autor_id === ME) myOps[o.staff_id] = {estrellas: o.estrellas, texto: o.texto, fecha: ms(o.creado), club: o.club_id};
  S.reviewDocs = ME ? [{id: ME, opina: myOps}] : [];
}

  const [jug, temps, fich, refs, opsS, opsA, plJ, plC, ped, priv, cuenta, club, myPubs] = await Promise.all([
    api("jugadores?select=*&id" + q), api("temporadas?select=*&persona_id" + q), api("fichajes?select=*&jugador_id" + q),
    api("referencias?select=*&jugador_id" + q), api("opiniones?select=*&staff_id" + q), api("opiniones?select=*&autor_id" + q),
    api("plantel?select=*&jugador_id" + q), api("plantel?select=*&club_id" + q),
    api("pedidos_referencia?select=*&jugador_id" + q), api("privado?select=datos&id" + q), api("cuentas?select=tipo&id" + q),
    api("clubes?select=*&id" + q), api("publicaciones?select=*&club_id" + q + "&order=creado.desc")
  ]);
  if (jug && jug[0]) C.full.set(ME, {row: jug[0], temps: temps || [], fich: (fich || [])[0] || null, t: Date.now()}); else C.full.delete(ME);
  C.refs.set(ME, refs || []);
  setScope(C.ops, opKey, o => o.staff_id === ME || o.autor_id === ME, (opsS || []).concat(opsA || []));
  setScope(C.pl, plKey, r => r.jugador_id === ME || r.club_id === ME, (plJ || []).concat(plC || []));
  if (club && club[0]) C.clubFull.set(ME, {row: club[0], t: Date.now()}); else C.clubFull.delete(ME);
  for (const x of myPubs || []) C.pubs.set(x.id, x);
  for (const [k, x] of C.pubs) if (x.club_id === ME && !(myPubs || []).some(y => y.id === k)) C.pubs.delete(k);
  // novedades de los clubes donde juega (para los avisos)
  const mis = (plJ || []).filter(r => r.estado === "aceptado").map(r => r.club_id);
  if (mis.length){ const pp = await api("publicaciones?select=*&club_id=in.(" + mis.map(encodeURIComponent).join(",") + ")&order=creado.desc&limit=60"); for (const x of pp || []) C.pubs.set(x.id, x); }
  C.ped = ped || []; C.priv = (priv || [])[0] || null; C.cuenta = (cuenta || [])[0] || null;

async function loadAll(){
  const [tar, clu, pubs] = await Promise.all([
    api("tarjetas?select=*&order=actualizado.desc&limit=5000"),
    api("clubes_pub?select=*&limit=2000"),
    api("publicaciones?select=*&order=creado.desc&limit=60")
  ]);
  const prevLite = new Map(C.lite.map(t => [t.id, t.actualizado]));
  C.lite = tar || []; C.clubsPub = clu || [];
  // fichas abiertas antes: si cambiaron, se vuelven a pedir al abrirlas
  for (const t of C.lite) if (t.id !== ME && C.full.has(t.id) && prevLite.get(t.id) !== t.actualizado) C.full.delete(t.id);
  for (const x of pubs || []) C.pubs.set(x.id, x);
  if (ME) await loadMine();
  else { C.full.clear(); C.clubFull.clear(); C.pl.clear(); C.ops.clear(); C.refs.clear(); C.ped = []; C.priv = null; C.cuenta = null; }
  assemble();
  const ped = C.ped, cuenta = C.cuenta, priv = C.priv;
  S.usedByHash = new Map(ped.filter(x => x.usado_por).map(x => [x.token_hash, x.usado_por]));
  const mine = ME ? S.players.find(p => p._id === ME) : null;
  S.myDoc = mine ? JSON.parse(JSON.stringify(mine)) : null;
  if (S.myDoc){ for (const k of ["_id", "_lite", "_tempN", "_sum"]) delete S.myDoc[k]; S.myDoc.inv = ped.map(x => ({h: x.token_hash, club: x.club, por: x.usado_por || ""})); }
  S.myClub = ME ? (S.clubs.find(c => c._id === ME) || null) : null;
  S.account = cuenta ? cuenta.tipo : null;
  if (S.account && S.account !== "club" && !S.myDoc) S.role = S.account;
  if (S.account === "club" && !S.myClub) S.role = "club";
  const pd = (priv && priv.datos) || {};
  S.priv = {tokens: pd.tokens && typeof pd.tokens === "object" ? pd.tokens : {}, fichaje: typeof pd.fichaje === "string" ? pd.fichaje : "", visto: +pd.visto || 0, miembrosVistos: Array.isArray(pd.miembrosVistos) ? pd.miembrosVistos : []};
  if (S.priv.fichaje) await sha(S.priv.fichaje);
  S.privLoaded = !!ME;
  S.loaded = S.clubsLoaded = S.reviewsLoaded = S.mineLoaded = true;
  S.loadError = null; S.lastLoad = Date.now();
}

/* ficha completa: se pide al abrirla */
async function hydratePlayer(id){
  const q = "=" + eq(id);
  const [jug, temps, fich, refs, ops, pl] = await Promise.all([
    api("jugadores?select=*&id" + q), api("temporadas?select=*&persona_id" + q), api("fichajes?select=*&jugador_id" + q),
    api("referencias?select=*&jugador_id" + q), api("opiniones?select=*&staff_id" + q), api("plantel?select=*&jugador_id" + q)
  ]);
  if (!jug || !jug[0]) throw {message: "not found"};
  C.full.set(id, {row: jug[0], temps: temps || [], fich: (fich || [])[0] || null, t: Date.now()});
  C.refs.set(id, refs || []);
  setScope(C.ops, opKey, o => o.staff_id === id, ops);
  setScope(C.pl, plKey, r => r.jugador_id === id && r.club_id !== ME, (pl || []).filter(r => r.club_id !== ME));
  // los clubes donde estuvo: su plantel (para "compañeros de plantel")
  const cl = [...new Set((pl || []).filter(r => r.estado === "aceptado" || r.estado === "ex").map(r => r.club_id))].filter(c => c !== ME);
  if (cl.length){ const rows = await api("plantel?select=*&club_id=in.(" + cl.map(encodeURIComponent).join(",") + ")&limit=500"); for (const r of rows || []) C.pl.set(plKey(r), r); }
}
async function hydrateClub(id){
  const q = "=" + eq(id);
  const [club, pubs, pl] = await Promise.all([api("clubes?select=*&id" + q), api("publicaciones?select=*&club_id" + q + "&order=creado.desc&limit=" + MAX_POSTS), api("plantel?select=*&club_id" + q)]);
  if (!club || !club[0]) throw {message: "not found"};
  C.clubFull.set(id, {row: club[0], t: Date.now()});
  for (const x of pubs || []) C.pubs.set(x.id, x);
  if (id !== ME) setScope(C.pl, plKey, r => r.club_id === id, pl);
}
async function hydrateOpen(x, kind){
  const d = $("#detail");
